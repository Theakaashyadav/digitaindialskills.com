<!-- CONTACT SECTION -->
<section class="contact-section">

  <div class="contact-container">

    <div class="contact-info">
      <span class="contact-tag">Get In Touch</span>
      <h2>Contact Us</h2>
      <p>
       <strong>Digital India Computer Education Council</strong>
      </p>

      <div class="contact-detail">
        <strong>📍 Address</strong>
        <span> D-35, 2nd FLOOR, OLD PLOT NO. 2-A,<br>
          PANCHPARMESHWAR MANDIRQ LAXMI NAGAR NEAR DOMINOS PARKING DELHI 110092.</span>
      </div>

      <div class="contact-detail">
        <strong>📞 Phone</strong>
        <span>+91-01146051145</span>
      </div>

      <div class="contact-detail">
        <strong>✉️ Email</strong>
        <span>support.digitalindiaskills@gmail.com</span>
      </div>
    </div>

  <form class="contact-form"
onsubmit="
event.preventDefault();

let name = this.querySelector('input[type=text]').value;
let email = this.querySelector('input[type=email]').value;
let phone = this.querySelector('input[type=tel]').value;
let course = this.querySelector('select').value;
let message = this.querySelector('textarea').value;

let whatsappMessage =
`New Enquiry:%0A%0A
Name: ${name}%0A
Email: ${email}%0A
Phone: ${phone}%0A
Course: ${course}%0A
Message: ${message}`;

window.open(
'https://wa.me/918796342637?text=' + whatsappMessage,
'_blank'
);
">

  <div class="form-group">
    <input type="text" placeholder="Your Name" required>
  </div>

  <div class="form-group">
    <input type="email" placeholder="Your Email" required>
  </div>

  <div class="form-group">
    <input type="tel" placeholder="Phone Number" required>
  </div>

  <div class="form-group">
    <select required>
      <option value="">Select Course</option>
      <option>Web Development</option>
      <option>Digital Marketing</option>
      <option>Computer Basics</option>
      <option>Other</option>
    </select>
  </div>

  <div class="form-group">
    <textarea placeholder="Your Message" rows="5"></textarea>
  </div>

  <button type="submit" class="contact-btn">
    Send Message
  </button>
</form>

  </div>

</section>


<style>
    /* CONTACT SECTION */

.contact-section{
    padding:45px 18px;
    background:transparent;
}

.contact-container{
    width:100%;
    max-width:1450px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1.2fr;
    gap:40px;
    padding:60px 50px;
    border-radius:36px;
    background:
      radial-gradient(circle at top left,rgba(194,165,109,0.24),transparent 28%),
      radial-gradient(circle at bottom right,rgba(84,122,149,0.24),transparent 32%),
      var(--gradient-section);
    border:1px solid rgba(255,255,255,0.16);
    overflow:hidden;
}

.contact-info{
    color:var(--white);
}

.contact-tag{
    display:inline-block;
    padding:9px 18px;
    border-radius:30px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(194,165,109,0.55);
    color:var(--accent-light);
    font-weight:800;
    margin-bottom:20px;
}

.contact-info h2{
    font-size:42px;
    margin-bottom:18px;
    font-weight:900;
}

.contact-info p{
    color:#E8EDF2;
    line-height:1.8;
    margin-bottom:28px;
}

.contact-detail{
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.16);
    padding:18px;
    border-radius:18px;
    margin-bottom:16px;
}

.contact-detail strong{
    display:block;
    color:var(--accent-light);
    margin-bottom:6px;
}

.contact-detail span{
    color:#E8EDF2;
}

.contact-form{
    background:rgba(255,255,255,0.90);
    padding:34px;
    border-radius:28px;
    border:1px solid rgba(255,255,255,0.7);
}

.form-group{
    margin-bottom:18px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:15px 18px;
    border-radius:14px;
    border:1px solid var(--border);
    outline:none;
    font-size:15px;
    color:var(--text);
    background:var(--white);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(194,165,109,0.16);
}

.contact-btn{
    width:100%;
    border:none;
    padding:16px 24px;
    border-radius:16px;
    background:var(--gradient-gold);
    color:var(--dark);
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    transition:0.35s ease;
}

.contact-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 32px rgba(194,165,109,0.35);
}

@media(max-width:768px){
    .contact-container{
        grid-template-columns:1fr;
        padding:40px 22px;
        border-radius:28px;
    }

    .contact-info h2{
        font-size:32px;
    }

    .contact-form{
        padding:24px;
    }
}

/* FLOATING CONTACT BUTTONS */

.floating-contact{
    position:fixed;
    right:22px;
    bottom:22px;
    display:flex;
    flex-direction:column;
    gap:16px;
    z-index:9999;
}

/* MAIN BUTTON */

.float-btn{
    position:relative;
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    overflow:hidden;
    transition:0.35s ease;
    box-shadow:0 14px 35px rgba(0,0,0,0.22);
    border:2px solid rgba(255,255,255,0.18);
}


/* =========================
   FULL RESPONSIVE CONTACT SECTION
========================= */

html,
body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
}

*{
    box-sizing:border-box;
}

.contact-container{
    width:100%;
}

/* Laptop */
@media(max-width:1200px){
    .contact-container{
        padding:50px 32px;
        gap:30px;
    }

    .contact-info h2{
        font-size:38px;
    }
}

/* Tablet */
@media(max-width:992px){
    .contact-container{
        grid-template-columns:1fr;
        padding:45px 28px;
        border-radius:30px;
    }

    .contact-info{
        text-align:center;
    }

    .contact-detail{
        text-align:center;
    }

    .contact-info h2{
        font-size:34px;
    }
}

/* Mobile */
@media(max-width:600px){
    .contact-section{
        padding:35px 14px;
    }

    .contact-container{
        padding:34px 18px;
        border-radius:24px;
        gap:24px;
    }

    .contact-tag{
        font-size:13px;
        padding:8px 14px;
    }

    .contact-info h2{
        font-size:28px;
        line-height:1.25;
    }

    .contact-info p{
        font-size:15px;
        line-height:1.7;
    }

    .contact-detail{
        padding:16px 14px;
    }

    .contact-detail span{
        font-size:14px;
        word-break:break-word;
    }

    .contact-form{
        padding:22px 16px;
        border-radius:22px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea{
        padding:14px 15px;
        font-size:14px;
    }

    .contact-btn{
        padding:15px 18px;
        font-size:15px;
    }

    .floating-contact{
        right:14px;
        bottom:14px;
        gap:12px;
    }

    .float-btn{
        width:50px;
        height:50px;
    }
}

/* Small mobile */
@media(max-width:380px){
    .contact-container{
        padding:28px 12px;
    }

    .contact-info h2{
        font-size:25px;
    }

    .contact-form{
        padding:18px 12px;
    }

    .floating-contact{
        right:10px;
        bottom:10px;
        gap:10px;
    }

    .float-btn{
        width:46px;
        height:46px;
    }
}
</style>
