<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>View Form Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 18px;
            background: linear-gradient(135deg, #e0e7ff, #f1f5f9);
            font-family: Arial, Helvetica, sans-serif;
            color: #0f172a;
        }

        .container {
            max-width: 794px;
            min-height: 1123px;
            margin: auto;
            background: #ffffff;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-top: 7px solid #1d4ed8;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.2);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            inset: 12px;
            border: 1px solid #e2e8f0;
            pointer-events: none;
        }

        h2 {
            margin: 0 0 12px;
            padding: 11px;
            text-align: center;
            font-size: 17px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: linear-gradient(90deg, #0f172a, #1d4ed8);
            border-radius: 7px;
            position: relative;
            z-index: 2;
        }

        .top-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
        }

        .left-actions,
        .right-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .back-btn,
        .action-btn {
            border: none;
            color: #ffffff;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            font-size: 12px;
            box-shadow: 0 5px 12px rgba(15, 23, 42, 0.18);
        }

        .back-btn {
            background: #0f172a;
        }

        .edit-btn {
            background: #2563eb;
        }

        .save-btn {
            background: #16a34a;
            display: none;
        }

        .print-btn {
            background: #7c3aed;
        }

        #detailsForm {
            position: relative;
            z-index: 2;
            min-height: 980px;
        }

        .details-layout {
            display: grid;
            grid-template-columns: 1fr 170px;
            grid-template-areas:
                "form photo"
                "sign sign";
            gap: 10px;
            min-height: 980px;
            align-content: stretch;
        }

        .details-left {
            grid-area: form;
            width: 100%;
        }

        .details-right {
            display: contents;
        }

        .details-right .media-box:first-child {
            grid-area: photo;
        }

        .details-right .media-box:last-child {
            grid-area: sign;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: #f8fafc;
            border: 1px solid #dbe3ef;
            padding: 8px;
            border-radius: 9px;
            min-height: 790px;
            align-content: stretch;
        }

        .form-group {
            border: 1px solid #dbe3ef;
            border-left: 4px solid #2563eb;
            padding: 7px 8px;
            background: #ffffff;
            min-height: 58px;
            border-radius: 7px;
        }

        .form-group:nth-child(even) {
            background: #fbfdff;
        }

        .form-group:hover {
            background: #eff6ff;
        }

        label {
            display: block;
            font-size: 8.8px;
            font-weight: 900;
            color: #1d4ed8;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.35px;
        }

        input,
        textarea {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 11.5px;
            font-weight: 800;
            color: #0f172a;
            padding: 2px 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        textarea {
            resize: vertical;
            min-height: 42px;
            line-height: 1.4;
        }

        input:not([readonly]),
        textarea:not([readonly]) {
            background: #fff7d6;
            border: 1px solid #f59e0b;
            border-radius: 5px;
            padding: 5px;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18);
        }

        .full {
            grid-column: span 3;
        }

        .media-box {
            border: 1px solid #cbd5e1;
            background: linear-gradient(180deg, #ffffff, #f8fafc);
            padding: 8px;
            border-radius: 9px;
            box-shadow: 0 5px 12px rgba(15, 23, 42, 0.08);
        }

        .media-box label {
            text-align: center;
            font-size: 9px;
            color: #0f172a;
            margin-bottom: 6px;
        }

        #photoBox,
        #signBox {
            width: 100%;
            border: 1.5px dashed #94a3b8;
            background: #f8fafc;
            padding: 8px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 7px;
        }

        #photoBox {
            min-height: 210px;
        }

        #signBox {
            min-height: 118px;
        }

        #photoBox img,
        #signBox img {
            object-fit: contain !important;
            border: 1px solid #334155;
            padding: 3px;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.14);
        }

        #photoBox img {
            max-width: 130px !important;
            max-height: 175px !important;
        }

        #signBox img {
            max-width: 520px !important;
            max-height: 78px !important;
        }

        #photoBox p,
        #signBox p {
            margin: 0;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
        }

        #photoBox a,
        #signBox a {
            display: none;
        }

        .loader {
            text-align: center;
            padding: 30px;
            font-size: 15px;
            border: 1px dashed #94a3b8;
            background: #f8fafc;
            color: #1e3a8a;
            font-weight: 800;
            border-radius: 10px;
            position: relative;
            z-index: 2;
        }

        @media print {
            @page {
                size: A4;
                margin: 5mm;
            }

            body {
                background: #ffffff;
                padding: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .container {
                width: 100%;
                max-width: 100%;
                min-height: auto;
                margin: 0;
                padding: 6px;
                border: 2px solid #000;
                border-top: 6px solid #1d4ed8;
                box-shadow: none;
            }

            .container::before {
                inset: 6px;
            }

            .top-actions,
            #photoBox a,
            #signBox a {
                display: none !important;
            }

            h2 {
                font-size: 13px;
                padding: 6px;
                margin-bottom: 6px;
                border-radius: 0;
            }

            #detailsForm {
                min-height: auto;
            }

            .details-layout {
                grid-template-columns: 1fr 145px;
                gap: 6px;
                min-height: auto;
            }

            .form-grid {
                gap: 4px;
                padding: 6px;
                min-height: 805px;
                border-radius: 0;
            }

            .form-group {
                padding: 5px;
                min-height: 45px;
                border-radius: 0;
                break-inside: avoid;
            }

            label {
                font-size: 7.5px;
                margin-bottom: 2px;
            }

            input,
            textarea {
                font-size: 9.5px;
            }

            textarea {
                min-height: 28px;
            }

            .media-box {
                padding: 5px;
                border-radius: 0;
                box-shadow: none;
            }

            #photoBox {
                min-height: 155px;
            }

            #signBox {
                min-height: 85px;
            }

            #photoBox img {
                max-width: 105px !important;
                max-height: 130px !important;
            }

            #signBox img {
                max-width: 470px !important;
                max-height: 58px !important;
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .container {
                max-width: 100%;
                min-height: auto;
                padding: 10px;
            }

            #detailsForm {
                min-height: auto;
            }

            .details-layout {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "photo"
                    "form"
                    "sign";
                min-height: auto;
            }

            .form-grid {
                grid-template-columns: 1fr;
                min-height: auto;
            }

            .full {
                grid-column: span 1;
            }

            .top-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .left-actions,
            .right-actions {
                justify-content: center;
            }

            .back-btn,
            .action-btn {
                width: 100%;
                text-align: center;
            }

            #photoBox,
            #signBox {
                min-height: 145px;
            }

            #signBox img {
                max-width: 100% !important;
            }
        }
    </style>
</head>

<body>

<div id="header"></div>
    <div class="container">

        <div class="top-actions">
            <div class="left-actions">
                <a href="register.html" class="back-btn">Back</a>
            </div>

            <div class="right-actions">
                <!-- <button type="button" class="action-btn edit-btn" id="editBtn" onclick="enableEdit()">Edit Form</button> -->
                <button type="button" class="action-btn save-btn" id="saveBtn" onclick="saveFormData()">Save
                    Changes</button>
                <button type="button" class="action-btn print-btn" onclick="printForm()">Print</button>
            </div>
        </div>

        <h2>Form Full Details</h2>

        <div id="loader" class="loader">Loading details...</div>

        <form id="detailsForm" style="display:none;">

            <div class="details-layout">

                <div class="details-left">
                    <div class="form-grid" id="formDetails"></div>
                </div>

                <div class="details-right">
                    <div class="form-group media-box">
                        <label>Photo</label>
                        <div id="photoBox">
                            <p>Photo not found</p>
                        </div>
                    </div>

                    <div class="form-group media-box">
                        <label>Signature</label>
                        <div id="signBox">
                            <p>Signature not found</p>
                        </div>
                    </div>
                </div>

            </div>

        </form>
    </div>
<div id="footer"></div>
    <script>

        /* Load Header */
fetch("header.html")
.then(res => res.text())
.then(data => {
    document.getElementById("header").innerHTML = data;

    const menuBtn = document.querySelector(".menu-btn");
    const navLinks = document.querySelector(".nav-links");

    if(menuBtn && navLinks){
        menuBtn.onclick = () => {
            navLinks.classList.toggle("show");
        };
    }
});

/* Load Footer */
fetch("footer.html")
.then(res => res.text())
.then(data => {
    document.getElementById("footer").innerHTML = data;
});

fetch("floating.html")
  .then(res => res.text())
  .then(data => {
    document.body.insertAdjacentHTML("beforeend", data);
  });

        const FORM_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4MyAlwkcQhoDZSBBdiHwWrEfq-tz8PG_KrmxZxn9FLWsWm9FI-qBDqBc3ziEa4xKsUA/exec";
        const IMAGE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjMQdWCZWBml3cxU6vNWUae0aj2xBu3a3VLTIm53jIw-WehqzH6yZr6tDVlA5MycE4/exec";

        const params = new URLSearchParams(window.location.search);
        const formId = params.get("form_id");

        const editableFields = [
            "Post",
            "Name",
            "Father/Husband Name",
            "Mobile",
            "Email",
            "Religion",
            "Category",
            "House No",
            "Address",
            "State",
            "City",
            "Area",
            "Pin Code",
            "Qualification",
            "DOB",
            "Aadhar",
            "Declaration",
            "Order ID",
            "Payment Status"
        ];

        function loadFormDetails() {
            if (!formId) {
                document.getElementById("loader").innerHTML = "Form ID missing";
                return;
            }

            const callbackName = "callback_" + Date.now();

            window[callbackName] = function (response) {
                if (response.status === "success") {
                    const allForms = response.data || [];
                    const form = allForms.find(row => String(row["Form ID"]) === String(formId));

                    if (form) {
                        renderDetails(form);
                        loadFormFiles(formId);
                    } else {
                        document.getElementById("loader").innerHTML = "Form not found";
                    }
                } else {
                    document.getElementById("loader").innerHTML = response.message || "Failed to load data";
                }

                delete window[callbackName];
                document.body.removeChild(script);
            };

            const script = document.createElement("script");
            script.src = FORM_SCRIPT_URL + "?action=getForms&callback=" + callbackName;
            document.body.appendChild(script);
        }

        function loadFormFiles(formId) {
            const callbackName = "fileCallback_" + Date.now();

            window[callbackName] = function (response) {
                if (response.status === "success") {
                    if (response.photo) {
                        document.getElementById("photoBox").innerHTML = `
              <img src="${response.photo}" alt="Photo">
              <br>
              <a href="${response.photo_url}" target="_blank">Open Photo</a>
            `;
                    }

                    if (response.sign) {
                        document.getElementById("signBox").innerHTML = `
              <img src="${response.sign}" alt="Signature">
              <br>
              <a href="${response.sign_url}" target="_blank">Open Signature</a>
            `;
                    }
                }

                delete window[callbackName];
                document.body.removeChild(script);
            };

            const script = document.createElement("script");
            script.src = IMAGE_SCRIPT_URL
                + "?action=getFormFiles"
                + "&form_id=" + encodeURIComponent(formId)
                + "&callback=" + callbackName;

            document.body.appendChild(script);
        }

        function renderDetails(form) {
            const formDetails = document.getElementById("formDetails");
            formDetails.innerHTML = "";

            const fields = [
                "Timestamp",
                "Form ID",
                "Post",
                "Name",
                "Father/Husband Name",
                "Mobile",
                "Email",
                "Religion",
                "Category",
                "House No",
                "Address",
                "State",
                "City",
                "Area",
                "Pin Code",
                "Qualification",
                "DOB",
                "Aadhar",
                "Declaration",
                "Order ID",
                "Payment Status"
            ];

            fields.forEach(field => {
                let value = form[field] || "";

if (field === "Timestamp") {
    value = formatDate(value);
}

if (field === "DOB") {
    value = formatDOB(value);
}

                const div = document.createElement("div");
                div.className = field === "Address" || field === "Declaration" ? "form-group full" : "form-group";

                if (field === "Address" || field === "Declaration") {
                    div.innerHTML = `
            <label>${field}</label>
            <textarea name="${field}" readonly>${value || ""}</textarea>
          `;
                } else {
                    div.innerHTML = `
            <label>${field}</label>
            <input type="text" name="${field}" value="${escapeHtml(value || "")}" readonly>
          `;
                }

                formDetails.appendChild(div);
            });

            document.getElementById("loader").style.display = "none";
            document.getElementById("detailsForm").style.display = "block";
        }

        //                 }
        //             });

        //             document.getElementById("saveBtn").style.display = "none";
        //             document.getElementById("editBtn").style.display = "inline-flex";
        //         } else {
        //             alert(response.message || "Update failed");
        //         }

        //         delete window[callbackName];
        //         document.body.removeChild(script);

        //     const script = document.createElement("script");
        //     script.src = FORM_SCRIPT_URL + query;
        //     document.body.appendChild(script);

        function printForm() {
            window.print();
        }

        function formatDate(value) {
            if (!value) return "";

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleString("en-IN");
        }

        /* ADD THIS HERE */
function formatDOB(value) {
    if (!value) return "";

    return value.split("T")[0];
}

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll('"', "&quot;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
        }

        loadFormDetails();
    </script>

</body>
