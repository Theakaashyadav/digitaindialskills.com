<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>View Form Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
    --primary: #547A95;
    --primary-dark: #3f6179;
    --secondary: #2C3947;
    --secondary-dark: #1f2a35;
    --accent: #C2A56D;
    --accent-dark: #a88950;
    --accent-light: #f4ead6;
    --gold: #C2A56D;
    --dark: #1b2732;
    --text: #222;
    --muted: #666;
    --light: #E8EDF2;
    --white: #ffffff;
    --border: #d8e0e7;
    --gradient-soft: linear-gradient(135deg, #dce4eb, #E8EDF2, #f4ead6);
    --shadow: 0 18px 45px rgba(44, 57, 71, 0.16);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    max-width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    background: var(--gradient-soft);
    font-family: Georgia, "Times New Roman", serif;
    color: var(--text);
}

img {
    max-width: 100%;
}

#header,
#footer {
    width: 100%;
    position: relative;
    z-index: 50;
}

.container {
    width: 794px;
    min-height: 1123px;
    margin: 28px auto;
    background: #fff;
    padding: 34px 38px;
    border: 1px solid rgba(84, 122, 149, 0.25);
    box-shadow: var(--shadow);
    position: relative;
    overflow: visible;
    border-radius: 18px;
}

.container::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(194, 165, 109, 0.45);
    border-radius: 14px;
    pointer-events: none;
}

.container::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    height: 7px;
    width: 100%;
    background: linear-gradient(90deg, #547A95, #C2A56D, #2C3947);
}

/* HEADER */
.form-header {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-bottom: 22px;
    padding: 18px 18px 16px;
    border-bottom: 2px solid #bdbdbd;
    background: linear-gradient(180deg, #ffffff, #f8fafc);
    border-radius: 14px;
    box-shadow: 0 8px 22px rgba(44, 57, 71, 0.08);
}

.form-logo {
    width: 280px;
    margin: 0 auto 8px;
}

.form-logo img {
    width: 100%;
    height: auto;
    object-fit: contain;
    display: block;
}

.form-brand-info {
    display: block;
}

.form-brand-info h1 {
    font-size: 23px;
    line-height: 1.2;
    font-weight: 900;
    color: #111;
    text-decoration: underline;
    text-transform: uppercase;
    margin: 8px 0 6px;
    letter-spacing: 0.3px;
}

.form-tagline {
    display: block;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: 800;
    color: var(--accent-dark);
    margin-bottom: 7px;
}

.form-contact-info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    text-align: center;
    font-family: Arial, sans-serif;
}

.form-contact-info p {
    display: block;
    font-size: 10.5px;
    line-height: 1.35;
    color: #2C3947;
    font-weight: 700;
    max-width: 640px;
}

h2 {
    display: none;
}

/* ACTION BUTTONS */
.top-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    font-family: Arial, sans-serif;
    position: relative;
    z-index: 5;
}

.left-actions,
.right-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.back-btn,
.action-btn {
    border: none;
    color: #fff;
    padding: 10px 16px;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    font-family: Arial, sans-serif;
}

.back-btn {
    background: #1f2a35;
}

.edit-btn {
    background: #547A95;
}

.save-btn {
    background: #1f8f4d;
    display: none;
}

.print-btn {
    background: #C2A56D;
    color: #111;
}

/* FORM LAYOUT */
#detailsForm {
    position: relative;
    z-index: 2;
    width: 100%;
}

.details-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 155px;
    gap: 22px;
    align-items: start;
    width: 100%;
}

.details-left {
    width: 100%;
    min-width: 0;
}

.details-right {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding-top: 6px;
    min-width: 0;
}

/* FORM DETAILS */
.form-grid {
    display: block;
    width: 100%;
    background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(248,250,252,0.9));
    border: 1px solid rgba(84, 122, 149, 0.18);
    padding: 16px 18px;
    box-shadow: 0 8px 24px rgba(44, 57, 71, 0.08);
    border-radius: 14px;
    overflow: visible;
}

.form-group {
    display: grid;
    grid-template-columns: 178px 1fr;
    align-items: start;
    gap: 14px;
    border: none;
    border-bottom: 1px dashed rgba(44, 57, 71, 0.22);
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    padding: 0 0 9px;
    min-height: auto;
    margin-bottom: 9px;
    overflow: visible;
}

.form-group::before {
    display: none;
}

.form-group:hover {
    transform: none;
    border-left: none;
    box-shadow: none;
    background: rgba(194, 165, 109, 0.06);
}

.form-group label {
    font-size: 14.5px;
    font-weight: 700;
    color: #2C3947;
    text-transform: none;
    letter-spacing: 0;
    margin: 0;
    line-height: 1.35;
    word-break: normal;
}

.form-group label::after {
    content: " :";
    float: right;
    color: #111;
}

input,
textarea {
    width: 100%;
    max-width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14.5px;
    font-weight: 600;
    color: #222;
    padding: 0;
    font-family: "Times New Roman", Times, serif !important;
    line-height: 1.35;
    white-space: normal;
    overflow: visible;
    text-overflow: unset;
    word-break: break-word;
}

textarea {
    resize: none;
    min-height: 48px;
    height: auto;
    overflow: visible;
}

input:not([readonly]),
textarea:not([readonly]) {
    background: #fff8df;
    border: 1px solid #C2A56D;
    padding: 6px 8px;
    border-radius: 6px;
}

.full {
    grid-column: auto;
}

/* PHOTO / SIGNATURE RIGHT SIDE */
.media-box {
    width: 100%;
    border: none;
    background: transparent;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
}

.media-box label {
    display: none;
}

#photoBox {
    width: 132px;
    height: 158px;
    border: 1px solid rgba(44, 57, 71, 0.35);
    background: #fff;
    padding: 4px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 8px 18px rgba(44, 57, 71, 0.12);
}

#signBox {
    width: 132px;
    min-height: 58px;
    border: none;
    background: transparent;
    padding: 0;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
}

#photoBox img {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    border: none !important;
    padding: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    border-radius: 0 !important;
}

#signBox img {
    width: 100% !important;
    max-height: 58px !important;
    object-fit: contain !important;
    border: none !important;
    padding: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    border-radius: 0 !important;
}

#photoBox p,
#signBox p {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    font-family: Arial, sans-serif;
}

#photoBox a,
#signBox a {
    display: none;
}

.loader {
    text-align: center;
    padding: 30px;
    font-size: 15px;
    border: 1px dashed #547A95;
    background: #E8EDF2;
    color: #2C3947;
    font-weight: 700;
    border-radius: 8px;
    font-family: Arial, sans-serif;
    position: relative;
    z-index: 3;
}

/* TABLET */
@media(max-width:900px) {
    .container {
        width: calc(100% - 28px);
        min-height: auto;
        padding: 30px 22px;
    }

    .details-layout {
        grid-template-columns: minmax(0, 1fr) 138px;
        gap: 16px;
    }

    .form-logo {
        width: 240px;
    }

    .form-brand-info h1 {
        font-size: 20px;
    }

    .form-tagline {
        font-size: 11.5px;
    }

    .form-contact-info p {
        font-size: 10px;
    }

    .form-grid {
        padding: 14px;
    }

    .form-group {
        grid-template-columns: 150px 1fr;
        gap: 10px;
    }

    .form-group label,
    input,
    textarea {
        font-size: 13.5px;
    }

    #photoBox {
        width: 122px;
        height: 148px;
    }

    #signBox {
        width: 122px;
        min-height: 55px;
    }
}

/* MOBILE */
@media(max-width:700px) {
    .container {
        width: calc(100% - 20px);
        margin: 18px auto;
        padding: 24px 14px;
        min-height: auto;
        border-radius: 14px;
    }

    .container::before {
        inset: 8px;
        border-radius: 10px;
    }

    .form-header {
        margin-bottom: 18px;
        padding: 14px 10px;
    }

    .form-logo {
        width: 210px;
    }

    .form-brand-info h1 {
        font-size: 17px;
        line-height: 1.25;
    }

    .form-tagline {
        font-size: 11px;
    }

    .form-contact-info p {
        font-size: 9.5px;
        line-height: 1.35;
    }

    .top-actions {
        flex-direction: column;
        align-items: stretch;
    }

    .left-actions,
    .right-actions {
        width: 100%;
        justify-content: center;
    }

    .back-btn,
    .action-btn {
        width: 100%;
        text-align: center;
    }

    .details-layout {
        grid-template-columns: 1fr;
        gap: 18px;
    }

    .details-right {
        order: -1;
        padding-top: 0;
    }

    .form-grid {
        padding: 14px 12px;
    }

    .form-group {
        grid-template-columns: 1fr;
        gap: 5px;
        margin-bottom: 12px;
        padding-bottom: 10px;
    }

    .form-group label::after {
        content: "";
    }

    .form-group label {
        font-weight: 800;
        color: #2C3947;
        font-size: 13.5px;
    }

    input,
    textarea {
        font-size: 13.5px;
        padding-left: 0;
    }

    #photoBox {
        width: 128px;
        height: 152px;
    }

    #signBox {
        width: 128px;
        min-height: 55px;
    }
}

/* SMALL MOBILE */
@media(max-width:380px) {
    .container {
        padding: 22px 10px;
    }

    .form-logo {
        width: 185px;
    }

    .form-brand-info h1 {
        font-size: 15px;
    }

    .form-contact-info p {
        font-size: 9px;
    }

    .form-group label,
    input,
    textarea {
        font-size: 13px;
    }
}

/* PRINT */
/* PRINT */
@media print {
    @page {
        size: A4;
        margin: 0;
    }

    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    html,
    body {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff !important;
        overflow: hidden !important;
    }

    #header,
    #footer,
    .top-actions {
        display: none !important;
    }

    .container {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 7mm 9mm !important;
        background: #fff !important;
        border: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        overflow: hidden !important;
        position: relative !important;

        display: flex !important;
        flex-direction: column !important;
    }

    .container::before {
        display: block !important;
        content: "";

        inset: 5mm;
        border: 1px solid rgba(194, 165, 109, 0.65);

    }

    .container::after {
        display: block !important;
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 3mm;
        width: 100%;
        background: linear-gradient(90deg, #547A95, #C2A56D, #2C3947);
    }

    .form-header {
        flex: 0 0 auto !important;
        margin: 0 0 4mm !important;
        padding: 3mm 4mm !important;
        border-bottom: 2px solid #bdbdbd !important;
        background: #fff !important;
        box-shadow: none !important;
        border-radius: 0 !important;
    }

    .form-logo {
        width: 52mm !important;
        margin: 0 auto 1mm !important;
    }

    .form-brand-info,
    .form-tagline,
    .form-contact-info {
        display: block !important;
    }

    .form-brand-info h1 {
        font-size: 16px !important;
        line-height: 1.15 !important;
        margin: 1mm 0 !important;
    }

    .form-tagline {
        font-size: 9px !important;
        margin-bottom: 1mm !important;
        font-family: Arial, sans-serif !important;
    }

    .form-contact-info p {
        display: block !important;
        font-size: 7.5px !important;
        line-height: 1.2 !important;
        margin: 0 !important;
        color: #222 !important;
        font-weight: 600 !important;
        font-family: Arial, sans-serif !important;
    }

    #detailsForm {
        flex: 1 1 auto !important;
        height: auto !important;
        min-height: 0 !important;
        display: flex !important;
        flex-direction: column !important;
    }

    .details-layout {
        flex: 1 1 auto !important;
        height: 100% !important;
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) 32mm !important;
        gap: 4mm !important;
        align-items: stretch !important;
    }

    .details-left {
        height: 100% !important;
        display: flex !important;
    }

    .form-grid {
        height: 100% !important;
        min-height: 100% !important;
        width: 100% !important;
        padding: 3mm 4mm !important;
        border: 1px solid #d8e0e7 !important;
        background: #fff !important;
        border-radius: 0 !important;
        box-shadow: none !important;

        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
    }

    .form-group {
        display: grid !important;
        grid-template-columns: 39mm 1fr !important;
        gap: 3mm !important;
        margin-bottom: 0 !important;
        padding-bottom: 1mm !important;
        border-bottom: 1px dashed rgba(44, 57, 71, 0.28) !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
    }

    .form-group label,
    input,
    textarea {
        font-size: 10.8px !important;
        line-height: 1.18 !important;
          font-family: "Times New Roman", Times, serif !important;
    }

    textarea {
        min-height: 7mm !important;
        resize: none !important;
        overflow: hidden !important;
    }

    .details-right {
        height: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        gap: 3mm !important;
        padding-top: 1mm !important;
    }

    #photoBox {
        width: 28mm !important;
        height: 34mm !important;
        padding: 1mm !important;
        box-shadow: none !important;
    }

    #signBox {
        width: 28mm !important;
        min-height: 12mm !important;
    }

    #photoBox img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
    }

    #signBox img {
        max-height: 12mm !important;
        object-fit: contain !important;
    }
}
</style>
</head>

<body>

  

    <div id="header"></div>
    <div class="container">

        <div class="form-header">
            <div class="form-logo">
                <img src="../../images/logo1.png" alt="Digital India Skills Logo">
            </div>

            <div class="form-brand-info">
                <h1>DIGITAL INDIA COMPUTER EDUCATION COUNCIL</h1>
                <p class="form-tagline">
                    Empowering Students Through Digital Learning
                </p>

                <div class="form-contact-info">
                    <p>📞 +91-8796342637  |  ✉️ abc@gmail.com</p>
                   
                    <p>
                        📍 D-35, 2nd FLOOR, OLD PLOT NO. 2-A, <br>PANCHPARMESHWAR MANDIRQ LAXMI NAGAR NEAR DOMINOS
                        PARKING DELHI 110092.
                    </p>
                </div>
            </div>
        </div>

 <div class="top-actions">
            <div class="left-actions">
                <a href="List.html" class="back-btn">Back</a>
            </div>

        </div>

        <!-- <h2>Form Details</h2> -->

        <div id="loader" class="loader">Loading details...</div>

        <form id="detailsForm" style="display:none;">

            <div class="details-layout">

                <div class="details-left">
                    <div class="form-grid" id="formDetails"></div>
                </div>

                <div class="details-right">
                    <div class="form-group media-box">
                        <label>Photo</label>
                        <div id="photoBox">
                            <p>Photo not found</p>
                        </div>
                    </div>

                    <div class="form-group media-box">
                        <label>Signature</label>
                        <div id="signBox">
                            <p>Signature not found</p>
                        </div>
                    </div>
                </div>

            </div>

        </form>

         <div class="top-actions">
            <div class="left-actions">
                <!-- <a href="List.html" class="back-btn">Back</a> -->
            </div>

            <div class="right-actions">
                <button type="button" class="action-btn edit-btn" id="editBtn" onclick="enableEdit()">Edit Form</button>
                <button type="button" class="action-btn save-btn" id="saveBtn" onclick="saveFormData()">Save
                    Changes</button>
                <button type="button" class="action-btn print-btn" onclick="printForm()">Print</button>
            </div>
        </div>

    </div>
    <div id="footer"></div>
    <script>

        /* Load Header */
        fetch("../header.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;

                const menuBtn = document.querySelector(".menu-btn");
                const navLinks = document.querySelector(".nav-links");

                if (menuBtn && navLinks) {
                    menuBtn.onclick = () => {
                        navLinks.classList.toggle("show");
                    };
                }
            });

        /* Load Footer */
        fetch("../footer.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });




        const FORM_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4MyAlwkcQhoDZSBBdiHwWrEfq-tz8PG_KrmxZxn9FLWsWm9FI-qBDqBc3ziEa4xKsUA/exec";
        const IMAGE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjMQdWCZWBml3cxU6vNWUae0aj2xBu3a3VLTIm53jIw-WehqzH6yZr6tDVlA5MycE4/exec";

        const params = new URLSearchParams(window.location.search);
        const formId = params.get("form_id");

        const editableFields = [
            "Post",
            "Name",
            "Father/Husband Name",
            "Mobile",
            "Email",
            "Religion",
            "Category",
            "House No",
            "Address",
            "State",
            "City",
            "Area",
            "Pin Code",
            "Qualification",
            "DOB",
            "Aadhar",
            "Declaration",
            "Order ID",
            "Payment Status"
        ];

        function loadFormDetails() {
            if (!formId) {
                document.getElementById("loader").innerHTML = "Form ID missing";
                return;
            }

            const callbackName = "callback_" + Date.now();

            window[callbackName] = function (response) {
                if (response.status === "success") {
                    const allForms = response.data || [];
                    const form = allForms.find(row => String(row["Form ID"]) === String(formId));

                    if (form) {
                        renderDetails(form);
                        loadFormFiles(formId);
                    } else {
                        document.getElementById("loader").innerHTML = "Form not found";
                    }
                } else {
                    document.getElementById("loader").innerHTML = response.message || "Failed to load data";
                }

                delete window[callbackName];
                document.body.removeChild(script);
            };

            const script = document.createElement("script");
            script.src = FORM_SCRIPT_URL + "?action=getForms&callback=" + callbackName;
            document.body.appendChild(script);
        }

        function loadFormFiles(formId) {
            const callbackName = "fileCallback_" + Date.now();

            window[callbackName] = function (response) {
                if (response.status === "success") {
                    if (response.photo) {
                        document.getElementById("photoBox").innerHTML = `
              <img src="${response.photo}" alt="Photo">
              <br>
              <a href="${response.photo_url}" target="_blank">Open Photo</a>
            `;
                    }

                    if (response.sign) {
                        document.getElementById("signBox").innerHTML = `
              <img src="${response.sign}" alt="Signature">
              <br>
              <a href="${response.sign_url}" target="_blank">Open Signature</a>
            `;
                    }
                }

                delete window[callbackName];
                document.body.removeChild(script);
            };

            const script = document.createElement("script");
            script.src = IMAGE_SCRIPT_URL
                + "?action=getFormFiles"
                + "&form_id=" + encodeURIComponent(formId)
                + "&callback=" + callbackName;

            document.body.appendChild(script);
        }

        function renderDetails(form) {
            const formDetails = document.getElementById("formDetails");
            formDetails.innerHTML = "";

            const fields = [
                "Timestamp",
                "Form ID",
                "Post",
                "Name",
                "Father/Husband Name",
                "Mobile",
                "Email",
                "Religion",
                "Category",
                "House No",
                "Address",
                "State",
                "City",
                "Area",
                "Pin Code",
                "Qualification",
                "DOB",
                "Aadhar",
                "Declaration",
                "Order ID",
                "Payment Status"
            ];

            fields.forEach(field => {
                let value = form[field] || "";

                if (field === "Timestamp") {
                    value = formatDate(value);
                }

                if (field === "DOB") {
                    value = formatDOB(value);
                }

                const div = document.createElement("div");
                div.className = field === "Address" || field === "Declaration" ? "form-group full" : "form-group";

                if (field === "Address" || field === "Declaration") {
                    div.innerHTML = `
            <label>${field}</label>
            <textarea name="${field}" readonly>${value || ""}</textarea>
          `;
                } else {
                    div.innerHTML = `
            <label>${field}</label>
            <input type="text" name="${field}" value="${escapeHtml(value || "")}" readonly>
          `;
                }

                formDetails.appendChild(div);
            });

            document.getElementById("loader").style.display = "none";
            document.getElementById("detailsForm").style.display = "block";
        }

        function enableEdit() {
            editableFields.forEach(field => {
                const element = document.querySelector(`[name="${field}"]`);
                if (element) {
                    element.removeAttribute("readonly");
                }
            });

            document.getElementById("editBtn").style.display = "none";
            document.getElementById("saveBtn").style.display = "inline-flex";
        }

        function saveFormData() {
            const callbackName = "updateCallback_" + Date.now();

            let query = "?action=updateFormData";
            query += "&form_id=" + encodeURIComponent(formId);
            query += "&callback=" + callbackName;

            editableFields.forEach(field => {
                const element = document.querySelector(`[name="${field}"]`);
                if (element) {
                    query += "&" + encodeURIComponent(field) + "=" + encodeURIComponent(element.value);
                }
            });

            window[callbackName] = function (response) {
                if (response.status === "success") {
                    alert("Form updated successfully");

                    editableFields.forEach(field => {
                        const element = document.querySelector(`[name="${field}"]`);
                        if (element) {
                            element.setAttribute("readonly", true);
                        }
                    });

                    document.getElementById("saveBtn").style.display = "none";
                    document.getElementById("editBtn").style.display = "inline-flex";
                } else {
                    alert(response.message || "Update failed");
                }

                delete window[callbackName];
                document.body.removeChild(script);
            };

            const script = document.createElement("script");
            script.src = FORM_SCRIPT_URL + query;
            document.body.appendChild(script);
        }

        function printForm() {
            window.print();
        }

        function formatDate(value) {
            if (!value) return "";

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleString("en-IN");
        }

        /* ADD THIS HERE */
        function formatDOB(value) {
            if (!value) return "";

            return value.split("T")[0];
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll('"', "&quot;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
        }

        loadFormDetails();
    </script>

</body>
