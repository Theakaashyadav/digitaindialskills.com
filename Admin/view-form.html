<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>View Form Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
    --primary:#547A95;
    --primary-dark:#3f6179;
    --secondary:#2C3947;
    --secondary-dark:#1f2a35;
    --accent:#C2A56D;
    --accent-dark:#a88950;
    --accent-light:#f4ead6;
    --gold:#C2A56D;
    --dark:#1b2732;
    --text:#3e4c59;
    --muted:#6b7b88;
    --light:#E8EDF2;
    --white:#ffffff;
    --border:#d8e0e7;
    --gradient-main:linear-gradient(135deg,#547A95,#2C3947);
    --gradient-premium:linear-gradient(135deg,#1b2732,#2C3947,#547A95);
    --gradient-gold:linear-gradient(135deg,#e3cf9d,#C2A56D,#9e814d);
    --gradient-soft:linear-gradient(135deg,#dce4eb,#E8EDF2,#f4ead6);
    --gradient-section:linear-gradient(135deg,#2C3947,#3f6179,#547A95);
    --shadow-light:rgba(44,57,71,0.14);
    --shadow-medium:rgba(44,57,71,0.22);
    --shadow:0 18px 45px rgba(44,57,71,0.16);
    --shadow-hover:0 28px 70px rgba(84,122,149,0.32);
    --radius:24px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:var(--gradient-soft);
    font-family:"Poppins", Arial, Helvetica, sans-serif;
    color:var(--text);
}

/* HEADER FOOTER FULL WIDTH */
#header,
#footer{
    width:100%;
    position:relative;
    z-index:50;
}

/* ONLY CONTENT HAS SPACE */
.page-wrap{
    width:100%;
    padding:28px 16px;
    background:
        radial-gradient(circle at top left, rgba(194,165,109,0.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(84,122,149,0.18), transparent 36%),
        var(--gradient-soft);
}

.container{
    max-width:794px;
    min-height:1123px;
    margin:auto;
    background:rgba(255,255,255,0.94);
    padding:16px;
    border:1px solid rgba(216,224,231,0.9);
    border-top:8px solid var(--accent);
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    border-radius:18px;
}

.container::before{
    content:"";
    position:absolute;
    inset:12px;
    border:1px solid rgba(84,122,149,0.16);
    pointer-events:none;
    border-radius:12px;
}

h2{
    margin:0 0 12px;
    padding:12px;
    text-align:center;
    font-size:17px;
    font-weight:900;
    color:var(--white);
    text-transform:uppercase;
    letter-spacing:0.8px;
    background:var(--gradient-premium);
    border-radius:10px;
    position:relative;
    z-index:2;
}

.top-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
    position:relative;
    z-index:2;
}

.left-actions,
.right-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.back-btn,
.action-btn{
    border:none;
    color:var(--white);
    padding:9px 15px;
    text-decoration:none;
    border-radius:10px;
    font-weight:800;
    cursor:pointer;
    font-size:12px;
    box-shadow:0 8px 18px var(--shadow-light);
    transition:0.3s ease;
}

.back-btn{
    background:var(--secondary-dark);
}

.edit-btn{
    background:var(--primary);
}

.save-btn{
    background:#1f8f4d;
    display:none;
}

.print-btn{
    background:var(--gradient-gold);
    color:var(--dark);
}

.back-btn:hover,
.action-btn:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-hover);
}

#detailsForm{
    position:relative;
    z-index:2;
    min-height:980px;
}

.details-layout{
    display:grid;
    grid-template-columns:1fr 170px;
    grid-template-areas:
        "form photo"
        "sign sign";
    gap:10px;
    min-height:980px;
    align-content:stretch;
}

.details-left{
    grid-area:form;
    width:100%;
}

.details-right{
    display:contents;
}

.details-right .media-box:first-child{
    grid-area:photo;
}

.details-right .media-box:last-child{
    grid-area:sign;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:6px;
    background:rgba(232,237,242,0.65);
    border:1px solid var(--border);
    padding:8px;
    border-radius:12px;
    min-height:790px;
    align-content:stretch;
}

.form-group{
    border:1px solid var(--border);
    border-left:4px solid var(--primary);
    padding:7px 8px;
    background:var(--white);
    min-height:58px;
    border-radius:9px;
}

.form-group:nth-child(even){
    background:#fbfdff;
}

.form-group:hover{
    background:var(--accent-light);
}

label{
    display:block;
    font-size:8.8px;
    font-weight:900;
    color:var(--primary-dark);
    margin-bottom:5px;
    text-transform:uppercase;
    letter-spacing:0.35px;
}

input,
textarea{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-size:11.5px;
    font-weight:800;
    color:var(--dark);
    padding:2px 0;
    font-family:Arial, Helvetica, sans-serif;
}

textarea{
    resize:vertical;
    min-height:42px;
    line-height:1.4;
}

input:not([readonly]),
textarea:not([readonly]){
    background:#fff8df;
    border:1px solid var(--accent);
    border-radius:6px;
    padding:5px;
}

input:focus,
textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 2px rgba(84,122,149,0.18);
}

.full{
    grid-column:span 3;
}

.media-box{
    border:1px solid var(--border);
    background:linear-gradient(180deg,#ffffff,#f8fafc);
    padding:8px;
    border-radius:12px;
    box-shadow:0 8px 18px var(--shadow-light);
}

.media-box label{
    text-align:center;
    font-size:9px;
    color:var(--secondary);
    margin-bottom:6px;
}

#photoBox,
#signBox{
    width:100%;
    border:1.5px dashed var(--primary);
    background:#f8fafc;
    padding:8px;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    border-radius:9px;
}

#photoBox{
    min-height:210px;
}

#signBox{
    min-height:118px;
}

#photoBox img,
#signBox img{
    object-fit:contain !important;
    border:1px solid var(--secondary);
    padding:3px;
    background:var(--white);
    box-shadow:0 4px 10px rgba(0,0,0,0.14);
}

#photoBox img{
    max-width:130px !important;
    max-height:175px !important;
}

#signBox img{
    max-width:520px !important;
    max-height:78px !important;
}

#photoBox p,
#signBox p{
    margin:0;
    color:var(--muted);
    font-size:11px;
    font-weight:700;
}

#photoBox a,
#signBox a{
    display:none;
}

.loader{
    text-align:center;
    padding:30px;
    font-size:15px;
    border:1px dashed var(--primary);
    background:var(--light);
    color:var(--secondary);
    font-weight:800;
    border-radius:12px;
    position:relative;
    z-index:2;
}

/* PRINT */
@media print{
    @page{
        size:A4;
        margin:5mm;
    }

    body{
        background:#ffffff;
        padding:0;
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
    }

    #header,
    #footer{
        display:none !important;
    }

    .page-wrap{
        padding:0;
        background:#ffffff;
    }

    .container{
        width:100%;
        max-width:100%;
        min-height:auto;
        margin:0;
        padding:6px;
        border:2px solid #000;
        border-top:6px solid var(--accent);
        box-shadow:none;
        border-radius:0;
    }

    .container::before{
        inset:6px;
        border-radius:0;
    }

    .top-actions,
    #photoBox a,
    #signBox a{
        display:none !important;
    }

    h2{
        font-size:13px;
        padding:6px;
        margin-bottom:6px;
        border-radius:0;
    }

    #detailsForm{
        min-height:auto;
    }

    .details-layout{
        grid-template-columns:1fr 145px;
        gap:6px;
        min-height:auto;
    }

    .form-grid{
        gap:4px;
        padding:6px;
        min-height:805px;
        border-radius:0;
    }

    .form-group{
        padding:5px;
        min-height:45px;
        border-radius:0;
        break-inside:avoid;
    }

    label{
        font-size:7.5px;
        margin-bottom:2px;
    }

    input,
    textarea{
        font-size:9.5px;
    }

    textarea{
        min-height:28px;
    }

    .media-box{
        padding:5px;
        border-radius:0;
        box-shadow:none;
    }

    #photoBox{
        min-height:155px;
    }

    #signBox{
        min-height:85px;
    }

    #photoBox img{
        max-width:105px !important;
        max-height:130px !important;
    }

    #signBox img{
        max-width:470px !important;
        max-height:58px !important;
    }
}

/* MOBILE */
@media(max-width:700px){
    .page-wrap{
        padding:18px 10px;
    }

    .container{
        max-width:100%;
        min-height:auto;
        padding:10px;
        border-radius:14px;
    }

    #detailsForm{
        min-height:auto;
    }

    .details-layout{
        grid-template-columns:1fr;
        grid-template-areas:
            "photo"
            "form"
            "sign";
        min-height:auto;
    }

    .form-grid{
        grid-template-columns:1fr;
        min-height:auto;
    }

    .full{
        grid-column:span 1;
    }

    .top-actions{
        flex-direction:column;
        align-items:stretch;
    }

    .left-actions,
    .right-actions{
        justify-content:center;
    }

    .back-btn,
    .action-btn{
        width:100%;
        text-align:center;
    }

    #photoBox,
    #signBox{
        min-height:145px;
    }

    #signBox img{
        max-width:100% !important;
    }
}

/* =========================
   FULL RESPONSIVE DETAILS PAGE
========================= */

html,
body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
}

img{
    max-width:100%;
}

/* Laptop */
@media(max-width:1200px){
    .container{
        max-width:92%;
    }
}

/* Tablet */
@media(max-width:900px){
    .page-wrap{
        padding:24px 14px;
    }

    .container{
        max-width:100%;
        min-height:auto;
        padding:14px;
    }

    .details-layout{
        grid-template-columns:1fr 150px;
        gap:8px;
        min-height:auto;
    }

    .form-grid{
        grid-template-columns:repeat(2, 1fr);
        min-height:auto;
    }

    .full{
        grid-column:span 2;
    }

    h2{
        font-size:15px;
        line-height:1.4;
    }

    #photoBox{
        min-height:180px;
    }

    #photoBox img{
        max-width:115px !important;
        max-height:150px !important;
    }
}

/* Mobile */
@media(max-width:700px){
    .page-wrap{
        padding:18px 10px;
    }

    .container{
        max-width:100%;
        min-height:auto;
        padding:10px;
        border-radius:14px;
    }

    .container::before{
        inset:7px;
    }

    h2{
        font-size:14px;
        padding:10px;
    }

    .top-actions{
        flex-direction:column;
        align-items:stretch;
    }

    .left-actions,
    .right-actions{
        width:100%;
        justify-content:center;
    }

    .back-btn,
    .action-btn{
        width:100%;
        text-align:center;
        padding:10px;
    }

    #detailsForm{
        min-height:auto;
    }

    .details-layout{
        grid-template-columns:1fr;
        grid-template-areas:
            "photo"
            "form"
            "sign";
        min-height:auto;
        gap:12px;
    }

    .form-grid{
        grid-template-columns:1fr;
        min-height:auto;
        gap:8px;
        padding:8px;
    }

    .full{
        grid-column:span 1;
    }

    .form-group{
        min-height:auto;
        padding:9px;
    }

    label{
        font-size:9px;
    }

    input,
    textarea{
        font-size:12px;
    }

    #photoBox,
    #signBox{
        min-height:145px;
    }

    #photoBox img{
        max-width:120px !important;
        max-height:150px !important;
    }

    #signBox img{
        max-width:100% !important;
        max-height:70px !important;
    }
}

/* Small mobile */
@media(max-width:380px){
    .page-wrap{
        padding:14px 6px;
    }

    .container{
        padding:8px;
    }

    h2{
        font-size:12px;
    }

    .form-grid{
        padding:6px;
    }

    .form-group{
        padding:8px 6px;
    }

    input,
    textarea{
        font-size:11px;
    }

    .back-btn,
    .action-btn{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div id="header"></div>
    <div class="container">

        <div class="top-actions">
            <div class="left-actions">
                <a href="List.html" class="back-btn">Back</a>
            </div>

            <div class="right-actions">
                <button type="button" class="action-btn edit-btn" id="editBtn" onclick="enableEdit()">Edit Form</button>
                <button type="button" class="action-btn save-btn" id="saveBtn" onclick="saveFormData()">Save
                    Changes</button>
                <button type="button" class="action-btn print-btn" onclick="printForm()">Print</button>
            </div>
        </div>

        <h2>Form Full Details</h2>

        <div id="loader" class="loader">Loading details...</div>

        <form id="detailsForm" style="display:none;">

            <div class="details-layout">

                <div class="details-left">
                    <div class="form-grid" id="formDetails"></div>
                </div>

                <div class="details-right">
                    <div class="form-group media-box">
                        <label>Photo</label>
                        <div id="photoBox">
                            <p>Photo not found</p>
                        </div>
                    </div>

                    <div class="form-group media-box">
                        <label>Signature</label>
                        <div id="signBox">
                            <p>Signature not found</p>
                        </div>
                    </div>
                </div>

            </div>

        </form>
    </div>
<div id="footer"></div>
    <script>

        /* Load Header */
fetch("../header.html")
.then(res => res.text())
.then(data => {
    document.getElementById("header").innerHTML = data;

    const menuBtn = document.querySelector(".menu-btn");
    const navLinks = document.querySelector(".nav-links");

    if(menuBtn && navLinks){
        menuBtn.onclick = () => {
            navLinks.classList.toggle("show");
        };
    }
});

/* Load Footer */
fetch("../footer.html")
.then(res => res.text())
.then(data => {
    document.getElementById("footer").innerHTML = data;
});




        const FORM_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4MyAlwkcQhoDZSBBdiHwWrEfq-tz8PG_KrmxZxn9FLWsWm9FI-qBDqBc3ziEa4xKsUA/exec";
        const IMAGE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjMQdWCZWBml3cxU6vNWUae0aj2xBu3a3VLTIm53jIw-WehqzH6yZr6tDVlA5MycE4/exec";

        const params = new URLSearchParams(window.location.search);
        const formId = params.get("form_id");

        const editableFields = [
            "Post",
            "Name",
            "Father/Husband Name",
            "Mobile",
            "Email",
            "Religion",
            "Category",
            "House No",
            "Address",
            "State",
            "City",
            "Area",
            "Pin Code",
            "Qualification",
            "DOB",
            "Aadhar",
            "Declaration",
            "Order ID",
            "Payment Status"
        ];

        function loadFormDetails() {
            if (!formId) {
                document.getElementById("loader").innerHTML = "Form ID missing";
                return;
            }

            const callbackName = "callback_" + Date.now();

            window[callbackName] = function (response) {
                if (response.status === "success") {
                    const allForms = response.data || [];
                    const form = allForms.find(row => String(row["Form ID"]) === String(formId));

                    if (form) {
                        renderDetails(form);
                        loadFormFiles(formId);
                    } else {
                        document.getElementById("loader").innerHTML = "Form not found";
                    }
                } else {
                    document.getElementById("loader").innerHTML = response.message || "Failed to load data";
                }

                delete window[callbackName];
                document.body.removeChild(script);
            };

            const script = document.createElement("script");
            script.src = FORM_SCRIPT_URL + "?action=getForms&callback=" + callbackName;
            document.body.appendChild(script);
        }

        function loadFormFiles(formId) {
            const callbackName = "fileCallback_" + Date.now();

            window[callbackName] = function (response) {
                if (response.status === "success") {
                    if (response.photo) {
                        document.getElementById("photoBox").innerHTML = `
              <img src="${response.photo}" alt="Photo">
              <br>
              <a href="${response.photo_url}" target="_blank">Open Photo</a>
            `;
                    }

                    if (response.sign) {
                        document.getElementById("signBox").innerHTML = `
              <img src="${response.sign}" alt="Signature">
              <br>
              <a href="${response.sign_url}" target="_blank">Open Signature</a>
            `;
                    }
                }

                delete window[callbackName];
                document.body.removeChild(script);
            };

            const script = document.createElement("script");
            script.src = IMAGE_SCRIPT_URL
                + "?action=getFormFiles"
                + "&form_id=" + encodeURIComponent(formId)
                + "&callback=" + callbackName;

            document.body.appendChild(script);
        }

        function renderDetails(form) {
            const formDetails = document.getElementById("formDetails");
            formDetails.innerHTML = "";

            const fields = [
                "Timestamp",
                "Form ID",
                "Post",
                "Name",
                "Father/Husband Name",
                "Mobile",
                "Email",
                "Religion",
                "Category",
                "House No",
                "Address",
                "State",
                "City",
                "Area",
                "Pin Code",
                "Qualification",
                "DOB",
                "Aadhar",
                "Declaration",
                "Order ID",
                "Payment Status"
            ];

            fields.forEach(field => {
                let value = form[field] || "";

if (field === "Timestamp") {
    value = formatDate(value);
}

if (field === "DOB") {
    value = formatDOB(value);
}

                const div = document.createElement("div");
                div.className = field === "Address" || field === "Declaration" ? "form-group full" : "form-group";

                if (field === "Address" || field === "Declaration") {
                    div.innerHTML = `
            <label>${field}</label>
            <textarea name="${field}" readonly>${value || ""}</textarea>
          `;
                } else {
                    div.innerHTML = `
            <label>${field}</label>
            <input type="text" name="${field}" value="${escapeHtml(value || "")}" readonly>
          `;
                }

                formDetails.appendChild(div);
            });

            document.getElementById("loader").style.display = "none";
            document.getElementById("detailsForm").style.display = "block";
        }

        function enableEdit() {
            editableFields.forEach(field => {
                const element = document.querySelector(`[name="${field}"]`);
                if (element) {
                    element.removeAttribute("readonly");
                }
            });

            document.getElementById("editBtn").style.display = "none";
            document.getElementById("saveBtn").style.display = "inline-flex";
        }

        function saveFormData() {
            const callbackName = "updateCallback_" + Date.now();

            let query = "?action=updateFormData";
            query += "&form_id=" + encodeURIComponent(formId);
            query += "&callback=" + callbackName;

            editableFields.forEach(field => {
                const element = document.querySelector(`[name="${field}"]`);
                if (element) {
                    query += "&" + encodeURIComponent(field) + "=" + encodeURIComponent(element.value);
                }
            });

            window[callbackName] = function (response) {
                if (response.status === "success") {
                    alert("Form updated successfully");

                    editableFields.forEach(field => {
                        const element = document.querySelector(`[name="${field}"]`);
                        if (element) {
                            element.setAttribute("readonly", true);
                        }
                    });

                    document.getElementById("saveBtn").style.display = "none";
                    document.getElementById("editBtn").style.display = "inline-flex";
                } else {
                    alert(response.message || "Update failed");
                }

                delete window[callbackName];
                document.body.removeChild(script);
            };

            const script = document.createElement("script");
            script.src = FORM_SCRIPT_URL + query;
            document.body.appendChild(script);
        }

        function printForm() {
            window.print();
        }

        function formatDate(value) {
            if (!value) return "";

            const date = new Date(value);

            if (isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleString("en-IN");
        }

        /* ADD THIS HERE */
function formatDOB(value) {
    if (!value) return "";

    return value.split("T")[0];
}

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll('"', "&quot;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
        }

        loadFormDetails();
    </script>

</body>

</html>
