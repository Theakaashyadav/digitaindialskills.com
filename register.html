<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to Your Account</title>

<style>
  :root{
    --primary:#547A95;
    --primary-dark:#3f6179;
    --secondary:#2C3947;
    --secondary-dark:#1f2a35;
    --accent:#C2A56D;
    --accent-dark:#a88950;
    --accent-light:#f4ead6;
    --gold:#C2A56D;
    --dark:#1b2732;
    --text:#3e4c59;
    --muted:#6b7b88;
    --light:#E8EDF2;
    --white:#ffffff;
    --border:#d8e0e7;
    --gradient-main:linear-gradient(135deg,#547A95,#2C3947);
    --gradient-premium:linear-gradient(135deg,#1b2732,#2C3947,#547A95);
    --gradient-gold:linear-gradient(135deg,#e3cf9d,#C2A56D,#9e814d);
    --gradient-soft:linear-gradient(135deg,#dce4eb,#E8EDF2,#f4ead6);
    --gradient-section:linear-gradient(135deg,#2C3947,#3f6179,#547A95);
    --shadow-light:rgba(44,57,71,0.14);
    --shadow-medium:rgba(44,57,71,0.22);
    --shadow:0 18px 45px rgba(44,57,71,0.16);
    --shadow-hover:0 28px 70px rgba(84,122,149,0.32);
    --radius:24px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--gradient-soft);
    min-height: 100vh;
    color: var(--text);
  }

  #header,
  #footer {
    width: 100%;
    display: block;
    position: relative;
    z-index: 20;
  }

  .form-container {
    max-width: 950px;
    margin: 50px auto;
    background: rgba(255,255,255,0.92);
    padding: 38px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,0.75);
    position: relative;
    overflow: hidden;
  }

  .form-container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    height: 7px;
    width: 100%;
    background: var(--gradient-gold);
  }

  h2 {
    text-align: center;
    margin-bottom: 30px;
    color: var(--dark);
    font-size: 30px;
    font-weight: 800;
    position: relative;
  }

  h2::after {
    content: "";
    width: 80px;
    height: 4px;
    background: var(--gradient-gold);
    display: block;
    margin: 12px auto 0;
    border-radius: 10px;
  }

  .back-btn {
    display: inline-block;
    margin-bottom: 25px;
    padding: 10px 18px;
    background: var(--gradient-main);
    color: var(--white);
    text-decoration: none;
    border-radius: 30px;
    font-weight: 700;
    box-shadow: var(--shadow);
    transition: 0.3s ease;
  }

  .back-btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px 22px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    background: var(--white);
    padding: 14px;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 18px var(--shadow-light);
  }

  label {
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--secondary);
    font-size: 14px;
  }

  input,
  select,
  textarea {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    background: #f8fafc;
    color: var(--dark);
    outline: none;
    transition: 0.3s ease;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--primary);
    background: var(--white);
    box-shadow: 0 0 0 4px rgba(84,122,149,0.18);
  }

  textarea {
    resize: none;
    height: 90px;
  }

  input[type="file"] {
    background: var(--white);
    padding: 10px;
    cursor: pointer;
  }

  input[type="file"]::file-selector-button {
    border: none;
    background: var(--gradient-main);
    color: var(--white);
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
    margin-right: 12px;
    font-weight: 600;
  }

  .full-width {
    grid-column: span 2;
  }

  .declaration {
    margin-top: 25px;
    padding: 15px;
    background: var(--accent-light);
    border-left: 5px solid var(--accent);
    border-radius: 12px;
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
  }

  .declaration input {
    width: auto;
    margin-right: 8px;
    transform: scale(1.1);
  }

  .btn {
    margin-top: 28px;
    width: 100%;
    padding: 16px;
    background: var(--gradient-main);
    color: var(--white);
    border: none;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 14px 28px rgba(84,122,149,0.35);
    transition: 0.3s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
  }

  .btn:disabled {
    opacity: 0.75;
    cursor: not-allowed;
    transform: none;
  }

  .btn.pay-mode {
    background: var(--gradient-gold) !important;
    color: var(--dark) !important;
    box-shadow: 0 14px 28px rgba(194,165,109,0.35) !important;
  }

  .payment-msg {
    margin-top: 18px;
    text-align: center;
    color: var(--secondary);
    font-weight: 700;
  }

  @media (max-width: 768px) {
    .form-container {
      margin: 30px 12px;
      padding: 24px 18px;
      border-radius: 18px;
    }

    h2 {
      font-size: 24px;
    }

    .form-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .full-width {
      grid-column: span 1;
    }

    .btn {
      font-size: 16px;
    }
  }
</style>
</head>

<body>
<div id="header"></div>
  <div class="form-container">
    <h2>Sign in to Your Account</h2>
 <a href="Admin/list.html" class="back-btn">Form List</a>
    <form id="dataForm">

      <input type="hidden" name="action" value="saveForm">

      <div class="form-grid">

        <div class="form-group">
          <label>Post</label>
          <select name="post" required>
            <option value="">Select</option>
            <option>Post 1</option>
            <option>Post 2</option>
          </select>
        </div>

        <div class="form-group">
          <label>Name *</label>
          <input type="text" name="name" placeholder="Name" required>
        </div>

        <div class="form-group">
          <label>Father/Husband Name *</label>
          <input type="text" name="father_name" placeholder="Father Name / Husband Name" required>
        </div>

        <div class="form-group">
          <label>Mobile No</label>
          <input type="tel" name="mobile" placeholder="Mobile">
        </div>

        <div class="form-group">
          <label>Email *</label>
          <input type="email" name="email" placeholder="Email" required>
        </div>

        <div class="form-group">
          <label>Religion</label>
          <select name="religion">
            <option value="">--Select--</option>
            <option>Hindu</option>
            <option>Muslim</option>
            <option>Sikh</option>
            <option>Christian</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Category</label>
          <select name="category">
            <option value="">--Select--</option>
            <option>General</option>
            <option>OBC</option>
            <option>SC</option>
            <option>ST</option>
          </select>
        </div>

        <div class="form-group">
          <label>House No./Flat No.</label>
          <input type="text" name="house_no" placeholder="House No./Flat No.">
        </div>

        <div class="form-group full-width">
          <label>Address</label>
          <textarea name="address" placeholder="Name of Premises / Building"></textarea>
        </div>

        <div class="form-group">
          <label>State</label>
          <select name="state">
            <option value="">--Select--</option>
            <option>Uttar Pradesh</option>
            <option>Delhi</option>
            <option>Haryana</option>
            <option>Rajasthan</option>
          </select>
        </div>

        <div class="form-group">
          <label>City</label>
          <select name="city">
            <option value="">Select</option>
            <option>Greater Noida</option>
            <option>Noida</option>
            <option>Delhi</option>
            <option>Ghaziabad</option>
          </select>
        </div>

        <div class="form-group">
          <label>City/Area</label>
          <input type="text" name="area" placeholder="City/Area">
        </div>

        <div class="form-group">
          <label>Pin Code</label>
          <input type="text" name="pin_code" placeholder="Zip/Pin Code">
        </div>

        <div class="form-group">
          <label>Qualification</label>
          <input type="text" name="qualification" placeholder="Qualification">
        </div>

        <div class="form-group">
          <label>Date Of Birth</label>
          <input type="date" name="dob">
        </div>

        <div class="form-group">
          <label>Aadhar Card No</label>
          <input type="text" name="aadhar" placeholder="Aadhar Card No">
        </div>

        <div class="form-group">
          <label>Upload Photo *</label>
          <input type="file" name="photo" id="photo" accept="image/*" required>
        </div>

        <div class="form-group">
          <label>Upload Signature *</label>
          <input type="file" name="signature" id="signature" accept="image/*" required>
        </div>

      </div>

      <div class="declaration">
        <input type="checkbox" name="declaration" value="Accepted" required>
        I hereby declare that the particulars provided in the form are correct.
      </div>

      <button type="submit" id="submitBtn" class="btn">Submit</button>
      <p id="paymentMsg" class="payment-msg"></p>
      <button type="button" id="payBtn" class="btn" style="display:none;">
        Pay ₹1
      </button>

    </form>
  </div>

  <div id="footer"></div>
  <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>


 <script>

       // Load Header
    fetch("header.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("header").innerHTML = data;

        // Attach menu button after header loads
        const menuBtn = document.querySelector(".menu-btn");
        const navLinks = document.querySelector(".nav-links");

        if (menuBtn) {
          menuBtn.onclick = () => {
            navLinks.classList.toggle("show");
          };
        }
      });

    // Load Footer
    fetch("footer.html")
      .then(res => res.text())
      .then(data => document.getElementById("footer").innerHTML = data);
      
      fetch("floating.html")
  .then(res => res.text())
  .then(data => {
    document.body.insertAdjacentHTML("beforeend", data);
  });
      


  const DATA_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycby4MyAlwkcQhoDZSBBdiHwWrEfq-tz8PG_KrmxZxn9FLWsWm9FI-qBDqBc3ziEa4xKsUA/exec";

  const PAYMENT_SCRIPT_URL = DATA_SCRIPT_URL;

  const FILE_UPLOAD_URL =
    "https://script.google.com/macros/s/AKfycbwjMQdWCZWBml3cxU6vNWUae0aj2xBu3a3VLTIm53jIw-WehqzH6yZr6tDVlA5MycE4/exec";

  const cashfree = Cashfree({
    mode: "sandbox"
  });

  let savedFormId = "";
  let savedOrderId = "";
  let formSubmitted = false;

  const form = document.getElementById("dataForm");
  const submitBtn = form.querySelector("button[type='submit']");
  const payBtn = document.getElementById("payBtn");
  const PRINT_PAGE_URL = "view-form.html";

  if (payBtn) {
    payBtn.style.display = "none";
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = () => {
        resolve(reader.result.split(",")[1]);
      };

      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function getFileExtension(filename) {
    const ext = filename.substring(filename.lastIndexOf("."));
    return ext || ".jpg";
  }

  async function uploadSingleImage(file, filename) {
    const base64Image = await fileToBase64(file);

    const formData = new FormData();
    formData.append("image", base64Image);
    formData.append("filename", filename);

    const response = await fetch(FILE_UPLOAD_URL, {
      method: "POST",
      body: formData
    });

    const text = await response.text();
    console.log("UPLOAD RESPONSE:", text);

    return JSON.parse(text);
  }

  async function startPayment() {
    if (!savedFormId) {
      alert("Please submit form first.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = "Processing...";

    try {
      const orderResponse = await fetch(
        PAYMENT_SCRIPT_URL + "?action=createOrder&form_id=" + encodeURIComponent(savedFormId)
      );

      const orderData = await orderResponse.json();
      console.log("ORDER DATA:", orderData);

      if (!orderData.payment_session_id) {
        alert(orderData.message || "Payment order creation failed");
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Pay ₹1";
        return;
      }

      savedOrderId = orderData.order_id;

      await cashfree.checkout({
        paymentSessionId: orderData.payment_session_id,
        redirectTarget: "_modal"
      });

    } catch (err) {
      console.log("Checkout cancelled or failed:", err);
    }

    if (savedOrderId) {
      try {
        const verifyResponse = await fetch(
          PAYMENT_SCRIPT_URL + "?action=verifyPayment&order_id=" + encodeURIComponent(savedOrderId)
        );

        const verifyData = await verifyResponse.json();
        console.log("VERIFY DATA:", verifyData);

        if (verifyData.status === "PAID") {
  alert("Payment successful. Your submitted form is opening for printout.");

  submitBtn.innerHTML = "Payment Done";
  submitBtn.disabled = true;

  window.open(
    PRINT_PAGE_URL + "?form_id=" + encodeURIComponent(savedFormId),
    "_blank"
  );

  return;
}

      } catch (err) {
        console.log(err);
        alert("Payment verification failed: " + err.message);
      }
    }

    submitBtn.disabled = false;
    submitBtn.innerHTML = "Pay ₹1";
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    if (formSubmitted) {
      startPayment();
      return;
    }

    const formData = new FormData(form);

    const photoFile = document.getElementById("photo").files[0];
    const signatureFile = document.getElementById("signature").files[0];

    if (!photoFile || !signatureFile) {
      alert("Please upload photo and signature.");
      return;
    }

    formData.set("action", "saveForm");

    try {
      submitBtn.disabled = true;
      submitBtn.innerHTML = "Submitting...";

      formData.delete("photo");
      formData.delete("signature");

      const formResponse = await fetch(DATA_SCRIPT_URL, {
        method: "POST",
        body: formData
      });

      const responseText = await formResponse.text();
      console.log("FORM RESPONSE:", responseText);

      let formResult;

      try {
        formResult = JSON.parse(responseText);
      } catch (error) {
        alert("Apps Script did not return JSON. Check deployment.");
        console.log("Invalid response:", responseText);
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Submit";
        return;
      }

      console.log("FORM RESULT:", formResult);

      if (formResult.status !== "success") {
        alert(formResult.message || "Form submit failed");
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Submit";
        return;
      }

      savedFormId = formResult.form_id;

      const photoName =
        "image" + savedFormId + getFileExtension(photoFile.name);

      const signatureName =
        "sign" + savedFormId + getFileExtension(signatureFile.name);

      const photoUpload = await uploadSingleImage(photoFile, photoName);
      const signUpload = await uploadSingleImage(signatureFile, signatureName);

      if (photoUpload.status !== "success" || signUpload.status !== "success") {
        alert("Form saved but image/signature upload failed.");
        submitBtn.disabled = false;
        submitBtn.innerHTML = "Submit";
        return;
      }

      alert(
        "Form submitted successfully.\nYour Form ID is " + savedFormId +
        "\nPhoto saved as: " + photoName +
        "\nSignature saved as: " + signatureName +
        "\n\nNow press the same button again to pay fees."
      );

      formSubmitted = true;

      submitBtn.disabled = false;
      submitBtn.innerHTML = "Pay ₹1";

      submitBtn.style.background = "linear-gradient(135deg, #16a34a, #22c55e)";
      submitBtn.style.boxShadow = "0 12px 25px rgba(34, 197, 94, 0.35)";

    } catch (err) {
      console.log(err);
      alert("Submit failed: " + err.message);

      submitBtn.disabled = false;
      submitBtn.innerHTML = "Submit";
    }
  });
</script>

</body>

</html>
