<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply Now</title>

  <style>
    :root {
      --primary: #547A95;
      --primary-dark: #3f6179;
      --secondary: #2C3947;
      --secondary-dark: #1f2a35;
      --accent: #C2A56D;
      --accent-dark: #a88950;
      --accent-light: #f4ead6;
      --gold: #C2A56D;
      --dark: #1b2732;
      --text: #3e4c59;
      --muted: #6b7b88;
      --light: #E8EDF2;
      --white: #ffffff;
      --border: #d8e0e7;
      --gradient-main: linear-gradient(135deg, #547A95, #2C3947);
      --gradient-premium: linear-gradient(135deg, #1b2732, #2C3947, #547A95);
      --gradient-gold: linear-gradient(135deg, #e3cf9d, #C2A56D, #9e814d);
      --gradient-soft: linear-gradient(135deg, #dce4eb, #E8EDF2, #f4ead6);
      --gradient-section: linear-gradient(135deg, #2C3947, #3f6179, #547A95);
      --shadow-light: rgba(44, 57, 71, 0.14);
      --shadow-medium: rgba(44, 57, 71, 0.22);
      --shadow: 0 18px 45px rgba(44, 57, 71, 0.16);
      --shadow-hover: 0 28px 70px rgba(84, 122, 149, 0.32);
      --radius: 24px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--gradient-soft);
      min-height: 100vh;
      color: var(--text);
    }

    #header,
    #footer {
      width: 100%;
      display: block;
      position: relative;
      z-index: 20;
    }

    .form-container {
      max-width: 950px;
      margin: 50px auto;
      background: rgba(255, 255, 255, 0.92);
      padding: 38px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.75);
      position: relative;
      overflow: hidden;
    }

    .form-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 7px;
      width: 100%;
      background: var(--gradient-gold);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: var(--dark);
      font-size: 30px;
      font-weight: 800;
      position: relative;
    }

    h2::after {
      content: "";
      width: 80px;
      height: 4px;
      background: var(--gradient-gold);
      display: block;
      margin: 12px auto 0;
      border-radius: 10px;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 25px;
      padding: 10px 18px;
      background: var(--gradient-main);
      color: var(--white);
      text-decoration: none;
      border-radius: 30px;
      font-weight: 700;
      box-shadow: var(--shadow);
      transition: 0.3s ease;
    }

    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 22px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      background: var(--white);
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 18px var(--shadow-light);
    }

    label {
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--secondary);
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      background: #f8fafc;
      color: var(--dark);
      outline: none;
      transition: 0.3s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(84, 122, 149, 0.18);
    }

    textarea {
      resize: none;
      height: 90px;
    }

    input[type="file"] {
      background: var(--white);
      padding: 10px;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      border: none;
      background: var(--gradient-main);
      color: var(--white);
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 12px;
      font-weight: 600;
    }

    .full-width {
      grid-column: span 2;
    }

    .declaration {
      margin-top: 25px;
      padding: 15px;
      background: var(--accent-light);
      border-left: 5px solid var(--accent);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
    }

    .declaration input {
      width: auto;
      margin-right: 8px;
      transform: scale(1.1);
    }

    .btn {
      margin-top: 28px;
      width: 100%;
      padding: 16px;
      background: var(--gradient-main);
      color: var(--white);
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(84, 122, 149, 0.35);
      transition: 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .btn:disabled {
      opacity: 0.75;
      cursor: not-allowed;
      transform: none;
    }

    .btn.pay-mode {
      background: var(--gradient-gold) !important;
      color: var(--dark) !important;
      box-shadow: 0 14px 28px rgba(194, 165, 109, 0.35) !important;
    }

    .payment-msg {
      margin-top: 18px;
      text-align: center;
      color: var(--secondary);
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .form-container {
        margin: 30px 12px;
        padding: 24px 18px;
        border-radius: 18px;
      }

      h2 {
        font-size: 24px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .full-width {
        grid-column: span 1;
      }

      .btn {
        font-size: 16px;
      }
    }

    /* =========================
   FULL RESPONSIVE FORM PAGE
========================= */

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
    }

    img {
      max-width: 100%;
    }

    /* Laptop */
    @media(max-width:1200px) {
      .form-container {
        max-width: 90%;
        margin: 45px auto;
        padding: 34px;
      }
    }

    /* Tablet */
    @media(max-width:900px) {
      .form-container {
        max-width: 94%;
        margin: 35px auto;
        padding: 28px 22px;
        border-radius: 20px;
      }

      h2 {
        font-size: 26px;
        line-height: 1.3;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .full-width {
        grid-column: span 1;
      }
    }

    /* Mobile */
    @media(max-width:600px) {
      .form-container {
        max-width: 100%;
        margin: 24px 12px;
        padding: 24px 16px;
        border-radius: 18px;
      }

      h2 {
        font-size: 23px;
        margin-bottom: 24px;
      }

      h2::after {
        width: 60px;
      }

      .back-btn {
        width: 100%;
        text-align: center;
        padding: 11px 16px;
        font-size: 14px;
      }

      .form-group {
        padding: 12px;
        border-radius: 14px;
      }

      label {
        font-size: 13px;
      }

      input,
      select,
      textarea {
        padding: 12px;
        font-size: 14px;
        border-radius: 10px;
      }

      input[type="file"] {
        font-size: 13px;
      }

      input[type="file"]::file-selector-button {
        display: block;
        width: 100%;
        margin: 0 0 10px 0;
        padding: 10px;
      }

      .declaration {
        font-size: 13px;
        padding: 13px;
      }

      .btn {
        padding: 15px;
        font-size: 16px;
        border-radius: 14px;
      }

      .payment-msg {
        font-size: 14px;
        line-height: 1.5;
      }
    }

    /* Small mobile */
    @media(max-width:380px) {
      .form-container {
        margin: 18px 8px;
        padding: 20px 12px;
      }

      h2 {
        font-size: 21px;
      }

      .form-group {
        padding: 10px;
      }

      input,
      select,
      textarea {
        font-size: 13px;
      }

      .btn {
        font-size: 15px;
      }
    }

    .qr-payment-box {
      display: none;
      margin-top: 25px;
      padding: 22px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 12px 28px var(--shadow-light);
      text-align: center;
    }

    .qr-payment-box.show {
      display: block;
    }

    .qr-payment-box h3 {
      color: var(--dark);
      margin-bottom: 10px;
    }

    .qr-payment-box img {
      width: 230px;
      max-width: 100%;
      border-radius: 16px;
      border: 4px solid var(--accent-light);
      margin: 15px auto;
      display: block;
    }

    .upi-id {
      font-weight: 800;
      color: var(--secondary);
      margin-bottom: 14px;
    }

    .notice-box {
      background: var(--accent-light);
      border-left: 5px solid var(--accent);
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .check-form-link-box {
      margin-bottom: 22px;
      padding: 16px;
      background: var(--accent-light);
      border: 1px solid rgba(194, 165, 109, .45);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 18px var(--shadow-light);
    }

    .check-form-link-box p {
      margin-bottom: 10px;
      font-weight: 700;
      color: var(--secondary);
    }

    .check-form-link {
      display: inline-block;
      padding: 11px 22px;
      background: var(--gradient-gold);
      color: var(--dark);
      text-decoration: none;
      border-radius: 30px;
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(194, 165, 109, .32);
      transition: .3s ease;
    }

    .check-form-link:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .qr-download-btn {
      display: inline-block;
      margin: 8px auto 18px;
      padding: 11px 22px;
      background: var(--gradient-main);
      color: #fff;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(84, 122, 149, .28);
    }

    .qr-download-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
  </style>
</head>

<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("header").innerHTML = data;

    const menuBtn = document.querySelector(".menu-btn");
    const navLinks = document.querySelector(".nav-links");

    if (menuBtn) {
      menuBtn.onclick = () => {
        navLinks.classList.toggle("show");
      };
    }
  });

fetch("footer.html")
  .then(res => res.text())
  .then(data => document.getElementById("footer").innerHTML = data);

fetch("floating.html")
  .then(res => res.text())
  .then(data => {
    document.body.insertAdjacentHTML("beforeend", data);
  });

const DATA_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby4MyAlwkcQhoDZSBBdiHwWrEfq-tz8PG_KrmxZxn9FLWsWm9FI-qBDqBc3ziEa4xKsUA/exec";

const FILE_UPLOAD_URL =
  "https://script.google.com/macros/s/AKfycbwjMQdWCZWBml3cxU6vNWUae0aj2xBu3a3VLTIm53jIw-WehqzH6yZr6tDVlA5MycE4/exec";

let savedFormId = "";
let formSubmitted = false;

const form = document.getElementById("dataForm");
const submitBtn = document.getElementById("submitBtn");
const paymentMsg = document.getElementById("paymentMsg");

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => {
      resolve(reader.result.split(",")[1]);
    };

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getFileExtension(filename) {
  const ext = filename.substring(filename.lastIndexOf("."));
  return ext || ".jpg";
}

async function uploadSingleImage(file, filename) {
  const base64Image = await fileToBase64(file);

  const formData = new FormData();
  formData.append("image", base64Image);
  formData.append("filename", filename);

  const response = await fetch(FILE_UPLOAD_URL, {
    method: "POST",
    body: formData
  });

  const text = await response.text();
  console.log("UPLOAD RESPONSE:", text);

  return JSON.parse(text);
}

async function startRazorpayPayment(formId) {
  try {
    submitBtn.disabled = true;
    submitBtn.innerHTML = "Creating Payment...";

    const orderResponse = await fetch(
      DATA_SCRIPT_URL +
      "?action=createOrder&form_id=" +
      encodeURIComponent(formId)
    );

    const orderData = await orderResponse.json();
    console.log("ORDER DATA:", orderData);

    if (orderData.status !== "success") {
      alert(orderData.message || "Payment order creation failed");
      submitBtn.disabled = false;
      submitBtn.innerHTML = "Pay ₹350";
      return;
    }

    const options = {
      key: orderData.key_id,
      amount: orderData.amount,
      currency: orderData.currency,
      name: "DICE",
      description: "Application Form Fee",
      order_id: orderData.order_id,

      handler: async function (response) {
        submitBtn.innerHTML = "Verifying Payment...";

        const verifyUrl =
          DATA_SCRIPT_URL +
          "?action=verifyPayment" +
          "&form_id=" + encodeURIComponent(formId) +
          "&razorpay_order_id=" + encodeURIComponent(response.razorpay_order_id) +
          "&razorpay_payment_id=" + encodeURIComponent(response.razorpay_payment_id) +
          "&razorpay_signature=" + encodeURIComponent(response.razorpay_signature);

        const verifyResponse = await fetch(verifyUrl);
        const verifyData = await verifyResponse.json();

        console.log("VERIFY DATA:", verifyData);

        if (verifyData.status === "PAID") {
          alert("Payment successful. You can now download your form.");

          window.location.href =
            "fetchbyno.html?form_id=" + encodeURIComponent(formId);
        } else {
          alert("Payment verification failed.");
          submitBtn.disabled = false;
          submitBtn.innerHTML = "Pay ₹350";
        }
      },

      prefill: {
        name: form.querySelector("[name='name']").value,
        email: form.querySelector("[name='email']").value,
        contact: form.querySelector("[name='mobile']").value
      },

      notes: {
        form_id: formId
      },

      theme: {
        color: "#547A95"
      },

      modal: {
        ondismiss: function () {
          submitBtn.disabled = false;
          submitBtn.innerHTML = "Pay ₹350";
          paymentMsg.innerHTML =
            "Your Form ID is <b>" + formId + "</b>. Payment was not completed.";
        }
      }
    };

    const rzp = new Razorpay(options);
    rzp.open();

  } catch (err) {
    console.log(err);
    alert("Payment failed: " + err.message);

    submitBtn.disabled = false;
    submitBtn.innerHTML = "Pay ₹350";
  }
}

form.addEventListener("submit", function (e) {
  e.preventDefault();

  submitBtn.disabled = true;
  submitBtn.innerHTML = "Submitting...";

  setTimeout(() => {
    alert("Process Failed Try later");

    paymentMsg.innerHTML = "Process Failed Try later";
    paymentMsg.style.color = "red";

    submitBtn.disabled = false;
    submitBtn.innerHTML = "Pay Fees 350";
  }, 700);
});
