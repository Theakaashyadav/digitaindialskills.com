<style>
:root{
    --primary:#547A95;
    --primary-dark:#3f6179;

    --secondary:#2C3947;

    --accent-light:#f4ead6;

    --text:#3e4c59;
    --muted:#6b7b88;
    --light:#E8EDF2;
    --white:#ffffff;

    --gradient-premium:linear-gradient(135deg,#1b2732,#2C3947,#547A95);
    --gradient-gold:linear-gradient(135deg,#e3cf9d,#C2A56D,#9e814d);

}

/* ---------- TOP BAR --------- */

}

.top-bar span{

}

.top-bar i{
    margin-left:5px;

}

.top-bar i:hover{
    color:var(--accent);
}

/* Mobile */
@media (max-width:600px){
    .top-bar{
        font-size:12px;
        padding:6px 8px;
        gap:6px;
    }

    .top-bar i{

    }

    .top-bar span{

    }
}

/* SOCIAL ICONS FIX */
.top-bar .social-links{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:0;
}

.top-bar .social-links a{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    border-radius:50%;
    color:var(--white);
    font-size:17px;
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(194,165,109,0.28);
    transition:0.3s ease;
}

.top-bar .social-links a i{
    margin:0;
    color:inherit;
}

.top-bar .social-links a:hover{
    transform:translateY(-3px);
    color:var(--white);
    border-color:var(--accent);
}

.top-bar .social-links a.instagram:hover{
    background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
}

.top-bar .social-links a.youtube:hover{
    background:#ff0000;
}

@media(max-width:600px){
    .top-bar .social-links a{
        width:28px;
        height:28px;
        font-size:14px;
    }
}

/* ---------- NAVBAR ---------- */
.navbar{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 50px;
    background:var(--primary);
    box-shadow:0 5px 18px var(--shadow-light);

    top:0;
    z-index:1000;
}

.logo{
  display:flex;
  align-items:center;
  gap:6px;
}

/* Logo Image Styling */
.logo img{
  height:60px;
  width:auto;
  max-width:250px;
  object-fit:contain;
  border-radius:12px;
  padding:0px;
  background:var(--white);
  transition:all 0.3s ease;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,0.15));
}

/* Hover Effect */
.logo img:hover{
  transform:scale(1.06);
  border-radius:16px;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,0.25));
}

/* Sticky header adjustment */
header.scrolled .logo img{

}

/* Tablet */
@media (max-width:992px){
  .logo img{
    height:55px;
    max-width:220px;
  }
}

/* Mobile */
@media (max-width:768px){

    max-width:190px;

}

/* Small Mobile */
@media (max-width:480px){

    max-width:160px;
    border-radius:8px;
  }

}

/* Very Small Screens */
@media (max-width:360px){

    max-width:135px;

}

/* NAV LINKS */
.nav-links{

.nav-links a{

.nav-links a:hover{

}

/* MENU BUTTON */
.menu-btn{

    font-size:30px;
    cursor:pointer;

}

/* ACTION BUTTONS */
.whatsapp-btn,
.admin-btn{
    color:#fff !important;
    font-weight:700;
    padding:9px 18px !important;
    border-radius:50px !important;
    margin-left:8px;
    display:flex !important;
    align-items:center;
    justify-content:center;
    gap:7px;
    white-space:nowrap;
    border:1px solid rgba(255,255,255,0.25);
    transition:0.35s ease;
}

.whatsapp-btn{
    background:linear-gradient(135deg,#25D366,#128C7E);
}

.admin-btn{
    background:var(--gradient-gold);
    color:var(--dark) !important;
    box-shadow:0 8px 20px rgba(194,165,109,0.28);
}

.whatsapp-btn:hover,
.admin-btn:hover{

    box-shadow:0 12px 28px rgba(0,0,0,0.25);
}

.admin-btn:hover{

}

/* MOBILE BUTTON FIX */
@media(max-width:900px){
    .whatsapp-btn,
    .admin-btn{

        margin:10px 20px !important;
        padding:14px 18px !important;
    }
}

/* MOBILE NAV */
@media(max-width:900px){

    .navbar{
        padding:12px 22px;
    }

    .menu-btn{
        display:block;
    }

    .nav-links{
        position:absolute;
        top:100%;
        right:-100%;
        width:100%;
        max-width:350px;
        background:var(--light);
        flex-direction:column;
        padding:12px 0;
        box-shadow:0 10px 30px var(--shadow-medium);
        transition:.45s;
        border-radius:0 0 16px 16px;
        overflow:hidden;
    }

    .nav-links a{
        width:100%;
        padding:14px 22px;
        border-bottom:1px solid rgba(0,0,0,.07);
        color:var(--dark);
        display:block;
    }

    .nav-links a:hover{
        background:var(--accent-light);
        color:var(--dark);
        box-shadow:none;
        transform:none;
    }

    .nav-links a.active{
        background:var(--accent-light);
        color:var(--dark);
        font-weight:700;
    }

    .nav-links.show{
        right:0;
    }

    .whatsapp-btn{
        margin:10px 20px;
        justify-content:center;
    }
}

/* MENU */
.menu{
    display:flex;
    gap:8px;
}

.menu li{
    position:relative;
}

/* MAIN LINKS */
.menu li a{
    color:var(--white);
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
    font-weight:600;
    font-size:16px;
    border-radius:8px;
    transition:all .25s ease;
}

/* HOVER EFFECT */
.menu li a:hover{
    background:var(--gradient-gold);
    color:var(--dark);
    transform:translateY(-1px);
}

/* SUBMENU */
.submenu{
    position:absolute;
    top:110%;
    left:0;
    background:var(--light);
    min-width:240px;
    display:none;
    border-radius:12px;
    box-shadow:0 12px 35px rgba(44,57,71,0.14);
    padding:6px 0;
    z-index:999;
    opacity:0;
    transform:translateY(10px);
    transition:all .3s ease;
    border:1px solid var(--border);
}

/* SHOW DROPDOWN */
.dropdown:hover > .submenu{
    display:block;
    opacity:1;
    transform:translateY(0);
}

/* SUBMENU LINKS */
.submenu li a{
    background:transparent;
    color:var(--dark);
    padding:10px 18px;
    font-size:15px;
    display:block;
}

/* SUBMENU HOVER */
.submenu li a:hover{
    background:var(--accent-light);
    color:var(--dark);
}

/* SUB-SUBMENU */
.sub-submenu{
    top:0;
    left:100%;
}

/* ---------- ARROWS ---------- */
.dropdown > a::after{
    content:"›";
    font-size:18px;
    font-weight:bold;
    margin-left:4px;
    transition:transform .3s ease;
}

.dropdown:hover > a::after{
    transform:rotate(90deg);
}

.submenu .dropdown > a{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.submenu .dropdown > a::after{
    content:"›";
    font-size:18px;
    font-weight:bold;
    transition:transform .3s ease;
}

.submenu .dropdown:hover > a::after{
    transform:translateX(4px);
}

/* REMOVE BULLETS */
ul, li{
    list-style:none;
    margin:0;
    padding:0;
}

.menu,
.submenu{
    list-style:none;
    margin:0;
    padding:0;
}

/* MOBILE FIX */
@media(max-width:900px){

    .menu{
        flex-direction:column;
        width:100%;
        gap:0;
    }

    .submenu{
        position:relative;
        box-shadow:none;
        display:none;
        border-radius:0;
    }

    .submenu.show{
        display:block;
    }

    .sub-submenu{
        left:0;
    }
}

</style>

<script>
document.querySelectorAll('.dropdown > a').forEach(item => {
  item.addEventListener('click', function(e){

    if(window.innerWidth < 900){
        e.preventDefault();

        let submenu = this.nextElementSibling;

        // close others
        document.querySelectorAll('.submenu').forEach(el => {
            if(el !== submenu) el.classList.remove('show');
        });

        submenu.classList.toggle('show');
    }

  });
});

document.querySelectorAll(".dropdown > a").forEach(link => {
    link.addEventListener("click", function(e){
        if(window.innerWidth <= 900){
            e.preventDefault();
            this.parentElement.classList.toggle("open");
        }
    });
});
</script>
