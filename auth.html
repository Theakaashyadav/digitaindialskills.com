<!DOCTYPE html>
<html>
<head>
  <title>Admin Access</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
    --primary:#547A95;
    --secondary:#2C3947;
    --secondary-dark:#1f2a35;
    --accent:#C2A56D;
    --accent-dark:#a88950;
    --dark:#1b2732;
    --text:#3e4c59;
    --muted:#6b7b88;
    --light:#E8EDF2;
    --white:#ffffff;
    --border:#d8e0e7;
    --gradient-main:linear-gradient(135deg,#547A95,#2C3947);
    --gradient-premium:linear-gradient(135deg,#1b2732,#2C3947,#547A95);
    --gradient-gold:linear-gradient(135deg,#e3cf9d,#C2A56D,#9e814d);
    --shadow-hover:0 28px 70px rgba(84,122,149,0.32);
    --radius:24px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Poppins", Arial, sans-serif;
}

html, body{
    width:100%;
    min-height:100%;
}

body{
    background:var(--gradient-premium);
    color:var(--text);
}

/* HEADER / FOOTER LOAD AREA */
#header,
#footer{
    width:100%;
    position:relative;
    z-index:10;
}

/* MAIN AUTH SECTION */
.auth-page{
    min-height:calc(100vh - 160px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:70px 20px;
    background:
        radial-gradient(circle at top left, rgba(194,165,109,0.28), transparent 34%),
        radial-gradient(circle at bottom right, rgba(84,122,149,0.32), transparent 36%),
        var(--gradient-premium);
    position:relative;
    overflow:hidden;
}

.auth-page::before{
    content:"";
    position:absolute;
    width:380px;
    height:380px;
    border-radius:50%;
    background:rgba(194,165,109,0.18);
    top:-120px;
    right:-110px;
    filter:blur(35px);
}

.auth-page::after{
    content:"";
    position:absolute;
    width:320px;
    height:320px;
    border-radius:50%;
    background:rgba(232,237,242,0.13);
    bottom:-110px;
    left:-100px;
    filter:blur(35px);
}

.login-box{
    width:100%;
    max-width:410px;
    padding:40px 32px;
    border-radius:var(--radius);
    background:rgba(255,255,255,0.92);
    border:1px solid rgba(255,255,255,0.65);
    box-shadow:0 30px 80px rgba(0,0,0,0.28);
    backdrop-filter:blur(18px);
    position:relative;
    overflow:hidden;
    z-index:2;
}

.login-box::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:6px;
    background:var(--gradient-gold);
}

.login-box h2{
    text-align:center;
    color:var(--secondary);
    font-size:30px;
    font-weight:800;
    margin-bottom:12px;
}

.login-info{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    margin-bottom:24px;
}

.tab-buttons{
    display:flex;
    gap:10px;
    margin-bottom:24px;
}

.tab-buttons button{
    padding:12px;
    margin:0;
    font-size:14px;
    border-radius:14px;
    background:#eef2f5;
    color:var(--secondary);
    box-shadow:none;
}

.tab-buttons button.active{
    background:var(--gradient-main);
    color:var(--white);
}

.input-box{
    margin-bottom:18px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    font-weight:700;
    color:var(--dark);
}

.input-box input{
    width:100%;
    padding:15px 16px;
    border:1px solid var(--border);
    border-radius:14px;
    outline:none;
    font-size:15px;
    color:var(--text);
    background:rgba(255,255,255,0.95);
    transition:0.3s ease;
}

.input-box input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(194,165,109,0.18);
}

button{
    width:100%;
    margin-top:8px;
    padding:15px;
    border:none;
    border-radius:16px;
    background:var(--gradient-main);
    color:var(--white);
    font-size:16px;
    cursor:pointer;
    font-weight:800;
    transition:0.35s ease;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-hover);
}

.security-note{
    margin-top:18px;
    padding:12px 14px;
    border-radius:14px;
    background:rgba(194,165,109,0.13);
    color:var(--secondary);
    font-size:13px;
    text-align:center;
    font-weight:600;
    line-height:1.6;
}

.security-note a{
    color:var(--accent-dark);
    font-weight:800;
    text-decoration:none;
}

.security-note a:hover{
    text-decoration:underline;
}

#message{
    margin-top:18px;
    text-align:center;
    font-weight:700;
    font-size:14px;
}

.success{
    color:#1f8f4d;
}

.error{
    color:#d93025;
}

.hide{
    display:none;
}

@media(max-width:480px){
    .auth-page{
        padding:45px 16px;
        min-height:calc(100vh - 120px);
    }

    .login-box{
        padding:34px 24px;
    }

    .login-box h2{
        font-size:26px;
    }
}

/* =========================
   FULL RESPONSIVE AUTH PAGE
========================= */

html,
body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
}

img{
    max-width:100%;
}

/* Laptop */
@media(max-width:1200px){
    .auth-page{
        padding:65px 18px;
    }
}

/* Tablet */
@media(max-width:768px){
    .auth-page{
        min-height:auto;
        padding:55px 16px;
    }

    .login-box{
        max-width:430px;
        padding:36px 26px;
        border-radius:22px;
    }

    .login-box h2{
        font-size:27px;
    }

    .login-info{
        font-size:13px;
    }
}

/* Mobile */
@media(max-width:520px){
    .auth-page{
        padding:45px 14px;
    }

    .auth-page::before{
        width:240px;
        height:240px;
        top:-80px;
        right:-90px;
    }

    .auth-page::after{
        width:220px;
        height:220px;
        bottom:-90px;
        left:-80px;
    }

    .login-box{
        max-width:100%;
        padding:32px 20px;
        border-radius:20px;
    }

    .login-box h2{
        font-size:24px;
    }

    .tab-buttons{
        gap:8px;
    }

    .tab-buttons button{
        font-size:13px;
        padding:11px 8px;
        border-radius:12px;
    }

    .input-box label{
        font-size:13px;
    }

    .input-box input{
        padding:14px;
        font-size:14px;
    }

    button{
        padding:14px;
        font-size:15px;
    }

    .security-note{
        font-size:12px;
        padding:11px;
    }
}

/* Small mobile */
@media(max-width:360px){
    .auth-page{
        padding:35px 10px;
    }

    .login-box{
        padding:28px 14px;
    }

    .login-box h2{
        font-size:22px;
    }

    .tab-buttons{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div id="header"></div>

<main class="auth-page">
  <div class="login-box">

    <h2 id="formTitle">Admin Login</h2>

    <p class="login-info" id="formInfo">
      Enter your registered Admin ID and 4-digit PIN to access dashboard.
    </p>

    <div class="tab-buttons">
      <button id="loginTab" class="active" onclick="showLogin()">Login</button>
    </div>

    <div class="input-box">
      <label>Admin ID</label>
      <input type="text" id="adminId" placeholder="Enter admin ID">
    </div>

    <div class="input-box">
      <label>Admin PIN</label>
      <input type="password" id="adminPin" maxlength="4" inputmode="numeric" placeholder="Enter 4-digit PIN">
    </div>

    <div class="input-box hide" id="confirmPinBox">
      <label>Confirm PIN</label>
      <input type="password" id="confirmPin" maxlength="4" inputmode="numeric" placeholder="Confirm 4-digit PIN">
    </div>

    <button id="mainBtn" onclick="adminLogin()">Login to Dashboard</button>

    <p class="security-note">
      To Reset PIN Contact Developer -
      <a href="https://wa.me/919115082252?text=Hi%20Akash%2C%20I%20want%20to%20reset%20my%20admin%20PIN" target="_blank">
        theakaashyadav
      </a>
    </p>

    <p id="message"></p>

  </div>
</main>

<div id="footer"></div>

<script>
const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXQjmQhJ3bhDkrjQk_5lL4YTidQ5JVqvIxPcIcIvCcYw0E3U8H5dI_5ts3eTTA9mbd/exec";
let currentMode = "login";

/* LOAD HEADER */
fetch("header.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("header").innerHTML = data;

    const menuBtn = document.querySelector(".menu-btn");
    const navLinks = document.querySelector(".nav-links");

    if(menuBtn && navLinks){
      menuBtn.onclick = () => {
        navLinks.classList.toggle("show");
      };
    }
  });

/* LOAD FOOTER */
fetch("footer.html")
  .then(res => res.text())
  .then(data => {
    document.getElementById("footer").innerHTML = data;
  });

function showLogin(){
  currentMode = "login";

  document.getElementById("formTitle").innerHTML = "Admin Login";
  document.getElementById("formInfo").innerHTML = "Enter your registered Admin ID and 4-digit PIN to access dashboard.";
  document.getElementById("mainBtn").innerHTML = "Login to Dashboard";

  document.getElementById("confirmPinBox").classList.add("hide");
  document.getElementById("loginTab").classList.add("active");

  document.getElementById("message").innerHTML = "";
}

function adminLogin(){
  const adminId = document.getElementById("adminId").value.trim();
  const adminPin = document.getElementById("adminPin").value.trim();
  const message = document.getElementById("message");

  if(adminId === "" || adminPin === ""){
    message.innerHTML = "Please enter Admin ID and PIN";
    message.className = "error";
    return;
  }

  if(!/^[0-9]{4}$/.test(adminPin)){
    message.innerHTML = "PIN must be exactly 4 digits";
    message.className = "error";
    return;
  }

  message.innerHTML = "Verifying admin details...";
  message.className = "";

  const callbackName = "handleAdminResponse_" + Date.now();

  window[callbackName] = function(data) {
    if(data.success){
      message.innerHTML = data.message;
      message.className = "success";

      localStorage.setItem("adminLogin", "true");
      localStorage.setItem("adminId", adminId);

      setTimeout(() => {
        window.location.href = "Admin/List.html";
      }, 1000);

    }else{
      message.innerHTML = data.message;
      message.className = "error";
    }

    delete window[callbackName];
    document.body.removeChild(script);
  };

  const script = document.createElement("script");

  script.src =
    APP_SCRIPT_URL +
    "?action=login" +
    "&adminId=" + encodeURIComponent(adminId) +
    "&pin=" + encodeURIComponent(adminPin) +
    "&callback=" + callbackName;

  script.onerror = function() {
    message.innerHTML = "Unable to connect. Please try again.";
    message.className = "error";
  };

  document.body.appendChild(script);
}
</script>

</body>
</html>
